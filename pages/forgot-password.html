<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نسيت كلمة المرور - هديتي</title>
    <link rel="stylesheet" href="../Front-End/Appearance/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <a href="../index.html" style="text-decoration: none;">
            <h2 style="color: var(--text-accent); font-weight: 800; margin-bottom: 40px; font-size: 3rem;">هديتي</h2>
        </a>

        <div class="login-card">
            <div style="text-align: center; margin-bottom: 24px;">
                <i class="fas fa-key" style="font-size: 3rem; color: var(--primary); margin-bottom: 16px;"></i>
                <h2>نسيت كلمة المرور؟</h2>
                <p class="subtitle">لا تقلق! أدخل بريدك الإلكتروني وسنرسل لك رابط إعادة تعيين كلمة المرور</p>
            </div>

            <form id="forgot-password-form">
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" required placeholder="example@mail.com">
                </div>
                <button type="submit" class="btn">إرسال رابط إعادة التعيين</button>
            </form>

            <p class="message" style="margin-top: 24px;">
                تذكرت كلمة المرور؟ <a href="login.html" style="color: var(--primary); font-weight: bold;">تسجيل
                    الدخول</a>
            </p>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../js/supabase-client.js';
        import { showSuccess, showError, showLoading } from '../js/toast.js';
        import { isValidEmail } from '../js/utils.js';

        const form = document.getElementById('forgot-password-form');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();

            if (!isValidEmail(email)) {
                showError('البريد الإلكتروني غير صحيح');
                return;
            }

            const loadingToast = showLoading('جاري إرسال الرابط...');
            const submitBtn = form.querySelector('button[type="submit"]');
            submitBtn.disabled = true;

            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/pages/reset-password.html'
                });

                if (error) throw error;

                loadingToast.remove();
                showSuccess('تم إرسال رابط إعادة التعيين إلى بريدك الإلكتروني');

                form.reset();

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);

            } catch (error) {
                loadingToast.remove();
                console.error('Reset password error:', error);
                showError('حدث خطأ في إرسال الرابط. تأكد من البريد الإلكتروني');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
