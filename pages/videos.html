<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فيديوهات هديتي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #E63946;
            --primary-dark: #C1121F;
            --secondary: #457B9D;
            --black: #1D3557;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
        }

        .video-container {
            height: 100vh;
            width: 100%;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .video-container::-webkit-scrollbar {
            display: none;
        }

        .video-container {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .video-wrapper {
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            max-width: 100%;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(230, 57, 70, 0.9);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            z-index: 100;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(230, 57, 70, 0.4);
        }

        .back-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(230, 57, 70, 0.6);
        }

        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px 20px;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
            color: white;
            z-index: 10;
            pointer-events: none;
        }

        .overlay * {
            pointer-events: auto;
        }

        .overlay h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .actions {
            position: absolute;
            left: 20px;
            bottom: 120px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .action-btn i {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .action-btn span {
            font-size: 12px;
            font-weight: 700;
        }

        .action-btn.liked {
            background: rgba(230, 57, 70, 0.9);
            border-color: var(--primary);
        }

        .action-btn.liked i {
            color: white;
            animation: heartBeat 0.3s ease;
        }

        @keyframes heartBeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 5;
        }

        .loading i {
            font-size: 48px;
            animation: spin 1s linear infinite;
            color: var(--primary);
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .loading p {
            margin-top: 16px;
            font-size: 16px;
            font-weight: 600;
        }

        .empty-state {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 40px;
        }

        .empty-state i {
            font-size: 80px;
            color: var(--primary);
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h2 {
            font-size: 28px;
            margin-bottom: 12px;
            font-weight: 900;
        }

        .empty-state p {
            font-size: 16px;
            opacity: 0.7;
        }

        .toast {
            position: fixed;
            top: 90px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(230, 57, 70, 0.95);
            backdrop-filter: blur(10px);
            color: white;
            padding: 16px 32px;
            border-radius: 50px;
            box-shadow: 0 8px 30px rgba(230, 57, 70, 0.4);
            z-index: 10000;
            opacity: 0;
            transition: all 0.3s ease;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast i {
            font-size: 20px;
        }

        @media (max-width: 768px) {
            .back-btn {
                top: 15px;
                right: 15px;
                padding: 10px 20px;
                font-size: 14px;
            }

            .actions {
                left: 15px;
                bottom: 100px;
                gap: 16px;
            }

            .action-btn {
                width: 50px;
                height: 50px;
            }

            .action-btn i {
                font-size: 20px;
            }

            .action-btn span {
                font-size: 11px;
            }

            .overlay {
                padding: 20px 15px;
            }

            .overlay h3 {
                font-size: 16px;
            }
        }

        @media (min-width: 769px) {
            video {
                max-width: 500px;
                height: 100vh;
                object-fit: contain;
            }

            .video-wrapper {
                background: #111;
            }

            .overlay {
                max-width: 500px;
                margin: 0 auto;
            }

            .actions {
                left: calc(50% + 270px);
            }
        }
    </style>
</head>

<body>
    <a href="../index.html" class="back-btn">
        <i class="fas fa-arrow-right"></i>
        <span>العودة</span>
    </a>

    <div class="video-container" id="video-feed">
        <div class="loading">
            <i class="fas fa-spinner"></i>
            <p>جاري تحميل الفيديوهات...</p>
        </div>
    </div>

    <script type="module">
        import { supabase } from '../js/supabase-client.js';

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas fa-check-circle"></i><span>${message}</span>`;
            document.body.appendChild(toast);

            setTimeout(() => toast.classList.add('show'), 100);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        async function loadVideos() {
            const container = document.getElementById('video-feed');

            try {
                const { data: videos, error } = await supabase
                    .from('videos')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                container.innerHTML = '';

                if (!videos || videos.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-video-slash"></i>
                            <h2>لا توجد فيديوهات حالياً</h2>
                            <p>تابعنا لمشاهدة أحدث الفيديوهات قريباً</p>
                        </div>
                    `;
                    return;
                }

                videos.forEach((video, index) => {
                    const wrapper = createVideoWrapper(video, index);
                    container.appendChild(wrapper);
                });

                setupObserver();

            } catch (error) {
                console.error('Error loading videos:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h2>حدث خطأ في التحميل</h2>
                        <p>الرجاء المحاولة مرة أخرى</p>
                    </div>
                `;
            }
        }

        function createVideoWrapper(video, index) {
            const wrapper = document.createElement('div');
            wrapper.className = 'video-wrapper';
            wrapper.setAttribute('data-video-id', video.id);

            const videoElement = document.createElement('video');
            videoElement.src = video.url;
            videoElement.loop = true;
            videoElement.playsinline = true;
            videoElement.muted = index !== 0;
            videoElement.controls = true;
            videoElement.preload = 'metadata';
            videoElement.crossOrigin = 'anonymous';

            videoElement.onerror = function () {
                wrapper.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h2>فشل تحميل الفيديو</h2>
                        <p>تأكد من صحة الرابط</p>
                    </div>
                `;
            };

            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.innerHTML = `<h3>${video.description || 'فيديو مميز'}</h3>`;

            const actions = document.createElement('div');
            actions.className = 'actions';

            const likeBtn = document.createElement('button');
            likeBtn.className = 'action-btn';
            likeBtn.innerHTML = `
                <i class="fas fa-heart"></i>
                <span>${video.likes || 0}</span>
            `;
            likeBtn.onclick = () => handleLike(video.id, likeBtn);

            const shareBtn = document.createElement('button');
            shareBtn.className = 'action-btn';
            shareBtn.innerHTML = `<i class="fas fa-share"></i>`;
            shareBtn.onclick = () => handleShare(video.url);

            actions.appendChild(likeBtn);
            actions.appendChild(shareBtn);

            wrapper.appendChild(videoElement);
            wrapper.appendChild(overlay);
            wrapper.appendChild(actions);

            videoElement.addEventListener('click', () => {
                if (videoElement.paused) {
                    videoElement.play();
                } else {
                    videoElement.pause();
                }
            });

            return wrapper;
        }

        function setupObserver() {
            const options = {
                root: document.getElementById('video-feed'),
                threshold: 0.7
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target.querySelector('video');
                    if (video) {
                        if (entry.isIntersecting) {
                            video.play().catch(e => console.log('Autoplay prevented:', e));
                        } else {
                            video.pause();
                        }
                    }
                });
            }, options);

            document.querySelectorAll('.video-wrapper').forEach(wrapper => {
                observer.observe(wrapper);
            });
        }

        async function handleLike(videoId, button) {
            const isLiked = button.classList.contains('liked');
            const countSpan = button.querySelector('span');
            let count = parseInt(countSpan.textContent) || 0;

            if (isLiked) {
                button.classList.remove('liked');
                count = Math.max(0, count - 1);
            } else {
                button.classList.add('liked');
                count++;
            }

            countSpan.textContent = count;

            try {
                await supabase
                    .from('videos')
                    .update({ likes: count })
                    .eq('id', videoId);
            } catch (error) {
                console.error('Error updating likes:', error);
            }
        }

        async function handleShare(url) {
            try {
                if (navigator.share) {
                    await navigator.share({
                        title: 'فيديو من هديتي',
                        text: 'شاهد هذا الفيديو الرائع!',
                        url: url
                    });
                } else {
                    await navigator.clipboard.writeText(url);
                    showToast('تم نسخ الرابط بنجاح');
                }
            } catch (error) {
                console.error('Error sharing:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', loadVideos);
    </script>
</body>

</html>
