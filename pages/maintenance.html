<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع تحت الصيانة - هديتي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../Front-End/Appearance/index.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--gray) 0%, var(--white) 100%);
            text-align: center;
            padding: 20px;
        }

        .maintenance-card {
            background: var(--white);
            padding: 60px 40px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            max-width: 600px;
            width: 100%;
            animation: fadeInUp 0.8s ease-out;
        }

        .icon-wrapper {
            width: 100px;
            height: 100px;
            background: var(--gray);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
        }

        .icon-wrapper i {
            font-size: 3rem;
            color: var(--primary);
        }

        h1 {
            font-size: 2.5rem;
            color: var(--black);
            margin-bottom: 20px;
            font-weight: 900;
        }

        p {
            font-size: 1.1rem;
            color: var(--gray-dark);
            margin-bottom: 40px;
            line-height: 1.8;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .social-links a {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--gray);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark);
            font-size: 1.2rem;
            transition: var(--transition-base);
        }

        .social-links a:hover {
            background: var(--primary);
            color: var(--white);
            transform: translateY(-3px);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="maintenance-card">
        <div class="icon-wrapper">
            <i class="fas fa-tools"></i>
        </div>
        <h1>نعود قريباً</h1>
        <p>
            نعمل حالياً على تحسين موقعنا لتقديم تجربة تسوق أفضل لكم.<br>
            نعتذر عن الإزعاج ونشكركم على صبركم.
        </p>

        <div style="margin-top: 30px; padding-top: 30px; border-top: 1px solid var(--gray);">
            <p style="margin-bottom: 15px; font-size: 0.9rem;">يمكنكم التواصل معنا عبر</p>
            <div class="social-links">
                <a href="#" data-social="whatsapp"><i class="fab fa-whatsapp"></i></a>
                <a href="#" data-social="instagram"><i class="fab fa-instagram"></i></a>
                <a href="#" data-social="facebook"><i class="fab fa-facebook"></i></a>
                <a href="mailto:info@hadyti.com"><i class="fas fa-envelope"></i></a>
            </div>
        </div>
    </div>

    <script type="module" src="../js/site-settings.js"></script>

</body>

</html>
