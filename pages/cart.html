<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة الشراء - هديتي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../Front-End/Appearance/index.css">
    <style>
        :root {
            --primary-color: #b71c1c;
            --primary-hover: #a50000;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-light: #636e72;
            --border-color: #dfe6e9;
            --success-color: #00b894;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
        }

        .cart-page {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            min-height: 60vh;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title i {
            color: var(--primary-color);
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        @media (max-width: 992px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Cart Items List */
        .cart-items-container {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .cart-item {
            display: flex;
            gap: 20px;
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item:hover {
            background-color: #fffbfb;
        }

        .cart-item-img {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid var(--border-color);
        }

        .cart-item-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cart-item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .item-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .item-price {
            font-weight: 700;
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .item-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .qty-control {
            display: flex;
            align-items: center;
            background: #f1f2f6;
            border-radius: 8px;
            padding: 2px;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            font-size: 1rem;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .qty-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        .qty-input {
            width: 40px;
            text-align: center;
            border: none;
            background: transparent;
            font-weight: 600;
            font-size: 1rem;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #ff4757;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .remove-btn:hover {
            background: #ffe0e3;
        }

        /* Order Summary */
        .cart-summary {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .summary-header {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .summary-row.total {
            color: var(--text-main);
            font-weight: 800;
            font-size: 1.4rem;
            border-top: 2px solid var(--border-color);
            padding-top: 20px;
            margin-top: 20px;
        }

        .checkout-btn {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 25px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(183, 28, 28, 0.3);
        }

        .checkout-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(183, 28, 28, 0.4);
        }

        .checkout-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state i {
            font-size: 5rem;
            color: #dfe6e9;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .empty-state p {
            color: var(--text-light);
            margin-bottom: 30px;
        }

        .btn-outline {
            display: inline-block;
            padding: 12px 30px;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            transition: all 0.3s;
        }

        .btn-outline:hover {
            background: var(--primary-color);
            color: white;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header>
        <div class="logo">
            <a href="../index.html" style="text-decoration: none;">
                <img src="../assets/images/logo.png" alt="هديتي" style="height: 50px;">
            </a>
        </div>

        <!-- Main Navigation -->
        <nav class="nav">
            <a href="../index.html" class="nav-link">
                <i class="fas fa-home"></i>
                <span>الرئيسية</span>
            </a>
            <a href="products.html" class="nav-link">
                <i class="fas fa-gifts"></i>
                <span>المنتجات</span>
            </a>
            <a href="videos.html" class="nav-link">
                <i class="fas fa-video"></i>
                <span>الفيديوهات</span>
            </a>
            <a href="track-order.html" class="nav-link">
                <i class="fas fa-search-location"></i>
                <span>تتبع طلبك</span>
            </a>
            <a href="contact.html" class="nav-link">
                <i class="fas fa-envelope"></i>
                <span>اتصل بنا</span>
            </a>
            <a href="support-chat.html" class="nav-link" style="color: var(--primary-color);">
                <i class="fas fa-headset"></i>
                <span>المساعد الذكي</span>
            </a>
        </nav>

        <div class="icon-navs">
            <div class="cart-icon-wrapper" id="cart-btn">
                <i class="fa-solid fa-bag-shopping"></i>
                <span class="cart-count" id="cart-count">0</span>
            </div>
            <div class="login" id="auth-section">
                <!-- Dynamic Auth Content -->
            </div>
            <div class="menu" id="menu-btn">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- Cart Dropdown -->
        <section class="cart-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 class="section-title" style="margin: 0; font-size: 1.2rem;">سلة الشراء</h2>
                <button id="closeCart" style="background:none; border:none; cursor:pointer;">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="cart-items-wrapper" style="max-height: 300px; overflow-y: auto;">
                <!-- Cart items will be added here dynamically -->
                <div class="empty-cart-msg" style="text-align: center; padding: 20px; color: var(--text-light);">
                    سلة التسوق فارغة
                </div>
            </div>
        </section>
    </header>

    <main class="cart-page">
        <h1 class="section-title">
            <i class="fas fa-shopping-cart"></i>
            سلة الشراء
        </h1>

        <div class="cart-layout">
            <!-- Cart Items -->
            <div class="cart-items-container" id="cart-items-wrapper">
                <div style="text-align: center; padding: 40px;">
                    <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--primary-color);"></i>
                    <p style="margin-top: 15px; color: var(--text-light);">جاري تحميل السلة...</p>
                </div>
            </div>

            <!-- Order Summary -->
            <div class="cart-summary">
                <div class="summary-header">ملخص الطلب</div>

                <div class="summary-row">
                    <span>المجموع الفرعي</span>
                    <span id="subtotal-display">0.00 ر.س</span>
                </div>

                <div class="summary-row">
                    <span>الشحن</span>
                    <span id="shipping-display">--</span>
                </div>

                <div class="summary-row total">
                    <span>الإجمالي</span>
                    <span id="total-display" style="color: var(--primary-color);">0.00 ر.س</span>
                </div>

                <button id="checkout-btn" class="checkout-btn" disabled>
                    <span>متابعة للدفع</span>
                    <i class="fas fa-arrow-left"></i>
                </button>

                <div
                    style="margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--text-light); font-size: 0.85rem;">
                    <i class="fas fa-shield-alt"></i>
                    <span>دفع آمن 100%</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer style="background: white; padding: 40px 0; margin-top: 60px; border-top: 1px solid #eee;">
        <div style="max-width: 1200px; margin: 0 auto; padding: 0 20px; text-align: center;">
            <p>&copy; 2024 هديتي. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <script type="module" src="../Front-End/Interaction/cart.js"></script>
</body>

</html>
