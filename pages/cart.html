<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة الشراء - هديتي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../Front-End/Appearance/index.css">
    <style>
        header {
            position: sticky;
        }

        .cart-page {
            padding: 60px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .cart-items-container {
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
        }

        .cart-summary {
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            height: fit-content;
            position: sticky;
            top: 100px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item-img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .cart-item-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-title {
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        .cart-item-price {
            color: var(--primary);
            font-weight: 600;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .qty-control {
            display: flex;
            align-items: center;
            border: 1px solid #eee;
            border-radius: 8px;
        }

        .qty-control button {
            width: 30px;
            height: 30px;
            border: none;
            background: white;
            cursor: pointer;
            color: var(--text-main);
        }

        .qty-control input {
            width: 40px;
            text-align: center;
            border: none;
            font-weight: 600;
        }

        .remove-btn {
            color: #dc3545;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            color: var(--text-light);
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--text-main);
        }

        .checkout-btn-large {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        .checkout-btn-large:hover {
            background: #7F0000;
        }

        @media (max-width: 768px) {
            .cart-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header>
        <div class="logo">
            <a href="../index.html" style="text-decoration: none;">
                <h2 style="color: var(--primary); font-weight: 800; margin: 0;">هديتي</h2>
            </a>
        </div>
        <div class="icon-navs">
            <div style="position: relative;">
                <div id="cart" style="cursor: pointer; padding: 10px;">
                    <i class="fas fa-shopping-cart fa-lg"></i>
                </div>
                <!-- Cart Dropdown -->
                <section class="cart-container">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <h2 class="section-title" style="margin: 0; font-size: 1.2rem;">سلة الشراء</h2>
                        <button id="closeCart" style="background:none; border:none; cursor:pointer;"><i
                                class="fas fa-times"></i></button>
                        <div class="cart-icon-wrapper" id="cart-btn">
                            <i class="fa-solid fa-bag-shopping"></i>
                            <span class="cart-count" id="cart-count">0</span>
                        </div>
                        <div class="login" id="auth-section">
                            <!-- Dynamic Auth Content -->
                        </div>
                        <div class="menu" id="menu-btn">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
    </header>

    <!-- Navigation Sidebar -->
    <nav class="nav" id="nav-menu">
        <ul>
            <li><a href="../index.html">الرئيسية</a></li>
            <li><a href="products.html">المنتجات</a></li>
            <li><a href="cart.html">سلة الشراء</a></li>
            <li><a href="#contact">تواصل معنا</a></li>
        </ul>
    </nav>

    <!-- Cart Page Section -->
    <section class="cart-page"
        style="margin-top: 150px; padding: 0 40px; max-width: 1200px; margin-left: auto; margin-right: auto;">
        <h2 class="section-title">سلة الشراء</h2>

        <div class="cart-layout" style="display: grid; grid-template-columns: 2fr 1fr; gap: 40px;">
            <!-- Cart Items List -->
            <div class="cart-list" id="full-cart-items"
                style="background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
                <div class="loading">جاري تحميل السلة...</div>
            </div>

            <!-- Order Summary -->
            <div class="order-summary"
                style="background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); height: fit-content;">
                <h3 style="margin-bottom: 20px; font-size: 1.4rem;">ملخص الطلب</h3>
                <div class="summary-row"
                    style="display: flex; justify-content: space-between; margin-bottom: 15px; color: #666;">
                    <span>المجموع الفرعي</span>
                    <span id="subtotal">0 ج.م</span>
                </div>
                <div class="summary-row"
                    style="display: flex; justify-content: space-between; margin-bottom: 15px; color: #666;">
                    <span>الشحن</span>
                    <span>مجاني</span>
                </div>
                <div class="divider" style="height: 1px; background: #eee; margin: 20px 0;"></div>
                <div class="summary-total"
                    style="display: flex; justify-content: space-between; font-weight: 800; font-size: 1.4rem; margin-bottom: 30px; color: var(--black);">
                    <span>الإجمالي</span>
                    <span id="total-price">0 ج.م</span>
                </div>
                <button class="checkout-btn" onclick="alert('سيتم تفعيل الدفع قريباً!')">إتمام الدفع</button>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer style="margin-top: auto;">
        <div class="footer-bottom">
            <p>&copy; 2025 <strong>هديتي</strong>. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <script type="module" src="../Front-End/Interaction/cart.js"></script>
    <script src="../Front-End/Interaction/main.js"></script>
</body>

</html>
