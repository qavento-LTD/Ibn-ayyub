<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نقطة البيع | هديتي</title>
    <!-- CSS is injected by layout.js, but we include it here for faster initial paint -->
    <link rel="stylesheet" href="../../css/admin-theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/admin-pos-enhanced.css">
</head>

<body>
    
    <div class="admin-container">
        <!-- Main Content -->
        <main class="main-content">
            <!-- Header is injected by layout.js -->
            
            <div class="pos-grid">
                <!-- Left: Products -->
                <div class="products-section">
                    <!-- Search & Filter -->
                    <div class="search-bar">
                        <i class="fas fa-search" style="color: var(--text-secondary);"></i>
                        <input type="text" id="product-search" placeholder="بحث باسم المنتج أو الباركود (F2)..." autocomplete="off">
                        <button class="btn btn-secondary" onclick="document.getElementById('product-search').value=''; renderSearchResults([]);">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    
                    <!-- Invoice Tabs -->
                    <div class="invoice-tabs" id="invoice-tabs">
                        <div class="invoice-tab active" data-invoice-id="1" onclick="switchInvoice(1)">
                            <i class="fas fa-receipt"></i>
                            <span>فاتورة 1</span>
                            <span class="close-invoice" onclick="event.stopPropagation(); closeInvoice(1)">
                                <i class="fas fa-times"></i>
                            </span>
                        </div>
                        <button class="new-invoice-btn" onclick="createNewInvoice()">
                            <i class="fas fa-plus"></i>
                            فاتورة جديدة
                        </button>
                    </div>
                    
                    <!-- Categories -->
                    <div class="categories-scroll" id="categories-container">
                        <div class="category-pill active" onclick="filterByCategory('all')">الكل</div>
                        <!-- Categories injected here -->
                    </div>
                    
                    <!-- Products Grid -->
                    <div id="search-results" class="products-grid">
                        <!-- Products injected here -->
                    </div>
                </div>
                
                <!-- Right: Cart -->
                <div class="cart-section">
                    
                    <div class="cart-header">
                        <h3 style="margin: 0;"><i class="fas fa-shopping-basket"></i> سلة المشتريات</h3>
                        <button class="btn btn-sm btn-danger" onclick="window.pos.clearCart()" style="padding: 6px 12px; font-size: 0.8rem;">
                            <i class="fas fa-trash"></i> تفريغ
                        </button>
                    </div>
                    
                    <div id="cart-items" class="cart-items">
                        <!-- Cart Items injected here -->
                        <div style="text-align: center; margin-top: 50px; color: var(--text-secondary);">
                            <i class="fas fa-shopping-cart" style="font-size: 3rem; margin-bottom: 10px; opacity: 0.3;"></i>
                            <p>السلة فارغة</p>
                        </div>
                    </div>
                    
                    <div class="cart-footer">
                        <div class="form-group" style="margin-bottom: 15px;">
                            <input type="text" id="customer-name" class="form-input" placeholder="اسم العميل (اختياري)">
                        </div>
                        
                        <div class="summary-row">
                            <span>عدد العناصر</span>
                            <span id="cart-count">0</span>
                        </div>
                        <div class="summary-row">
                            <span>الضريبة (0%)</span>
                            <span>0.00 جنية</span>
                        </div>
                        <div class="total-row">
                            <span>الإجمالي</span>
                            <span id="cart-total" style="color: var(--primary);">0.00 جنية</span>
                        </div>
                        
                        <button class="btn btn-primary checkout-btn" onclick="handleCheckout()">
                            <i class="fas fa-money-bill-wave"></i> إتمام الدفع (F9)
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Modals -->
    
    <!-- Shift Modal -->
    <div id="shift-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">إدارة الوردية</h3>
                <button class="close-modal" onclick="closeModal('shift-modal')">&times;</button>
            </div>
            <div id="shift-modal-body">
                <!-- Content injected by JS -->
            </div>
        </div>
    </div>
    
    <!-- Print Options Modal -->
    <div id="print-options-modal" class="modal">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <div style="margin-bottom: 20px; color: var(--success); font-size: 4rem;">
                <i class="fas fa-check-circle"></i>
            </div>
            <h3 class="modal-title">تم الدفع بنجاح!</h3>
            <p style="margin-bottom: 30px; color: var(--text-secondary);">كيف تريد طباعة الفاتورة؟</p>
            
            <div style="display: grid; gap: 12px;">
                <button class="btn btn-primary" onclick="printCurrentInvoice('thermal')" style="justify-content: center;">
                    <i class="fas fa-receipt"></i> إيصال حراري (صغير)
                </button>
                <button class="btn btn-secondary" onclick="printCurrentInvoice('standard')" style="justify-content: center;">
                    <i class="fas fa-file-invoice"></i> فاتورة A4 (قياسي)
                </button>
                <button class="btn" onclick="closeModal('print-options-modal')" style="margin-top: 10px; color: var(--text-secondary);">
                    إغلاق بدون طباعة
                </button>
            </div>
        </div>
    </div>
    
    <!-- Keyboard Shortcuts Help -->
    <div id="shortcuts-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">اختصارات لوحة المفاتيح</h3>
                <button class="close-modal" onclick="closeModal('shortcuts-modal')">&times;</button>
            </div>
            <div class="grid-2">
                <div style="padding: 10px; background: #f8f9fa; border-radius: 8px;">
                    <strong>F2</strong> <span style="float: left;">بحث عن منتج</span>
                </div>
                <div style="padding: 10px; background: #f8f9fa; border-radius: 8px;">
                    <strong>F9</strong> <span style="float: left;">إتمام الدفع</span>
                </div>
                <div style="padding: 10px; background: #f8f9fa; border-radius: 8px;">
                    <strong>Esc</strong> <span style="float: left;">إغلاق النوافذ</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { initAdminLayout } from '../../js/admin/layout.js';
        initAdminLayout('admin');
    </script>
    <script type="module" src="../../js/shifts.js"></script>
    <script type="module">
        import { POSSystem } from '../../js/pos.js';
        import { ShiftManager } from '../../js/shifts.js';
        import { formatPrice, showToast } from '../../js/utils.js';
        
        // Initialize Systems
        window.pos = new POSSystem();
        window.shiftManager = new ShiftManager();
        
        // Global Helpers
        window.formatPrice = formatPrice;
        window.showToast = showToast;
        window.closeModal = (id) => document.getElementById(id).classList.remove('active');
        window.showShiftModal = () => window.shiftManager.showShiftModal();
        window.updateShiftStatus = updateShiftStatus;
        
        // --- Multi-Invoice System ---
        let invoices = {
            1: { id: 1, cart: [], name: 'فاتورة 1' }
        };
        let currentInvoiceId = 1;
        let nextInvoiceId = 2;
        
        // Create New Invoice
        window.createNewInvoice = () => {
            const newId = nextInvoiceId++;
            invoices[newId] = {
                id: newId,
                cart: [],
                name: `فاتورة ${newId}`
            };
            
            // Add tab
            const tabsContainer = document.getElementById('invoice-tabs');
            const newInvoiceBtn = tabsContainer.querySelector('.new-invoice-btn');
            
            const tab = document.createElement('div');
            tab.className = 'invoice-tab';
            tab.setAttribute('data-invoice-id', newId);
            tab.onclick = () => switchInvoice(newId);
            tab.innerHTML = `
                <i class="fas fa-receipt"></i>
                <span>فاتورة ${newId}</span>
                <span class="close-invoice" onclick="event.stopPropagation(); closeInvoice(${newId})">
                    <i class="fas fa-times"></i>
                </span>
            `;
            
            tabsContainer.insertBefore(tab, newInvoiceBtn);
            switchInvoice(newId);
            showToast(`تم إنشاء ${invoices[newId].name}`, 'success');
        };
        
        // Switch Invoice
        window.switchInvoice = (invoiceId) => {
            if (!invoices[invoiceId]) return;
            
            // Save current cart
            if (invoices[currentInvoiceId]) {
                invoices[currentInvoiceId].cart = [...window.pos.cart];
            }
            
            // Switch to new invoice
            currentInvoiceId = invoiceId;
            window.pos.cart = [...(invoices[invoiceId].cart || [])];
            
            // Update UI
            document.querySelectorAll('.invoice-tab').forEach(tab => {
                tab.classList.toggle('active', tab.getAttribute('data-invoice-id') == invoiceId);
            });
            
            window.pos.renderCart();
        };
        
        // Close Invoice
        window.closeInvoice = (invoiceId) => {
            const invoiceCount = Object.keys(invoices).length;
            
            if (invoiceCount === 1) {
                showToast('لا يمكن إغلاق آخر فاتورة', 'error');
                return;
            }
            
            if (invoices[invoiceId] && invoices[invoiceId].cart.length > 0) {
                if (!confirm(`هل أنت متأكد من إغلاق ${invoices[invoiceId].name}؟ سيتم فقد جميع العناصر.`)) {
                    return;
                }
            }
            
            // Remove tab
            const tab = document.querySelector(`.invoice-tab[data-invoice-id="${invoiceId}"]`);
            if (tab) tab.remove();
            
            // Delete invoice
            delete invoices[invoiceId];
            
            // Switch to another invoice if this was active
            if (currentInvoiceId === invoiceId) {
                const remainingIds = Object.keys(invoices);
                if (remainingIds.length > 0) {
                    switchInvoice(parseInt(remainingIds[0]));
                }
            }
            
            showToast('تم إغلاق الفاتورة', 'info');
        };
        
        // Clear current invoice after checkout
        const originalCheckout = window.pos.checkout.bind(window.pos);
        window.pos.checkout = async function(...args) {
            const result = await originalCheckout(...args);
            if (result) {
                // Clear current invoice cart
                if (invoices[currentInvoiceId]) {
                    invoices[currentInvoiceId].cart = [];
                }
            }
            return result;
        };
        
        // --- Event Listeners ---
        document.addEventListener('DOMContentLoaded', async () => {
            // Check Shift
            await updateShiftStatus();
            
            // Load Initial Products (Top 20 or similar)
            loadInitialProducts();
            
            // Setup Keyboard Shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'F2') {
                    e.preventDefault();
                    document.getElementById('product-search').focus();
                }
                if (e.key === 'F9') {
                    e.preventDefault();
                    handleCheckout();
                }
                if (e.key === 'Escape') {
                    document.querySelectorAll('.modal.active').forEach(m => m.classList.remove('active'));
                }
            });
        });
        
        // --- Search Logic ---
        const searchInput = document.getElementById('product-search');
        let searchTimeout;
        
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            
            if (query.length < 1) {
                loadInitialProducts(); // Show default if empty
                return;
            }
            
            searchTimeout = setTimeout(async () => {
                const results = await window.pos.searchProduct(query);
                renderSearchResults(results);
            }, 300);
        });
        
        searchInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const query = e.target.value.trim();
                if (!query) return;
                
                const results = await window.pos.searchProduct(query);
                
                if (results.length > 0) {
                    const exactMatch = results.find(p => p.barcode === query);
                    const productToAdd = exactMatch || results[0];
                    window.pos.addToCart(productToAdd);
                    searchInput.value = '';
                    searchInput.focus();
                    showToast(`تم إضافة ${productToAdd.title}`, 'success');
                } else {
                    showToast('المنتج غير موجود', 'error');
                }
            }
        });
        
        // --- Render Functions ---
        async function loadInitialProducts() {
            // Mock loading initial products or fetch from Supabase
            // For now, let's just search for empty string or fetch recent
            const results = await window.pos.searchProduct('');
            renderSearchResults(results);
        }
        
        function renderSearchResults(products) {
            const container = document.getElementById('search-results');
            
            if (!products || products.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-secondary);">
                        <i class="fas fa-box-open" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.5;"></i>
                        <p>لا توجد منتجات مطابقة</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = products.map(product => `
                <div class="product-card" onclick="window.pos.addToCart({
                    id: '${product.id}', 
                    title: '${product.title}', 
                    price: ${product.price}, 
                    cost_price: ${product.cost_price || 0}, 
                    barcode: '${product.barcode || ''}'
                })">
                    <div class="product-title">${product.title}</div>
                    <div>
                        <div class="product-price">${formatPrice(product.price)}</div>
                        <div class="product-stock">
                            <i class="fas fa-cube"></i> ${product.stock}
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        // --- Checkout Logic ---
        let lastInvoiceData = null;
        
        window.handleCheckout = async () => {
            const customerName = document.getElementById('customer-name').value;
            const result = await window.pos.checkout(customerName);
            
            if (result) {
                lastInvoiceData = result;
                document.getElementById('customer-name').value = '';
                document.getElementById('print-options-modal').classList.add('active');
            }
        };
        
        window.printCurrentInvoice = (type) => {
            if (lastInvoiceData) {
                window.pos.printInvoice(lastInvoiceData.invoice, lastInvoiceData.items, type);
                // closeModal('print-options-modal'); // Optional
            }
        };
        
        // --- Shift Logic ---
        async function updateShiftStatus() {
            const shift = await window.shiftManager.checkOpenShift();
            
            // Try to find header actions to inject status
            const headerActions = document.getElementById('header-actions');
            let statusEl = document.getElementById('shift-status-badge');
            
            if (!statusEl && headerActions) {
                statusEl = document.createElement('div');
                statusEl.id = 'shift-status-badge';
                // Insert before user profile
                headerActions.insertBefore(statusEl, headerActions.firstChild);
            } else if (!statusEl) {
                // Fallback if header not ready yet
                return;
            }
            console.log(window.shiftManager);
            
            if (shift) {
                statusEl.className = 'shift-status-badge open';
                statusEl.innerHTML = `
                    <i class="fas fa-circle" style="font-size: 0.6rem;"></i>
                    وردية مفتوحة (#${shift.id.slice(0, 4)})
                `;
                statusEl.onclick = showShiftModal;
                window.pos.currentShift = shift;
            } else {
                statusEl.className = 'shift-status-badge closed';
                statusEl.innerHTML = `
                    <i class="fas fa-lock"></i> الوردية مغلقة
                `;
                statusEl.onclick = showShiftModal;
                window.pos.currentShift = null;
            }
        }
    </script>
</body>

</html>
