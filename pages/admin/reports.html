<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقارير - لوحة التحكم</title>
    <!-- CSS is injected by layout.js, but we include it here for faster initial paint -->
    <link rel="stylesheet" href="../../css/admin-theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Page Specific Overrides */
        .date-filter {
            display: flex;
            gap: 10px;
            background: var(--bg-card);
            padding: 10px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .date-input {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            font-family: inherit;
            color: var(--text-main);
            background: var(--bg-main);
        }

        .filter-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            padding: 8px 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .filter-btn:hover {
            background: var(--primary-dark);
        }

        /* Summary Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 20px;
            border: 1px solid var(--border-color);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        .stat-info h3 {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .stat-info p {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
        }

        /* Tables */
        .report-section {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            padding: 24px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-open {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-closed {
            background: #e2e3e5;
            color: #41464b;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <!-- Main Content -->
        <main class="main-content">
            <!-- Header is injected by layout.js -->

            <div
                style="display: flex; justify-content: flex-end; margin-bottom: 20px; margin-top: -60px; position: relative; z-index: 901; pointer-events: none;">
                <!-- Hack to place filter in header area -->
                <div class="date-filter" style="pointer-events: auto;">
                    <input type="date" id="startDate" class="date-input">
                    <span style="align-self: center; color: var(--text-secondary);">إلى</span>
                    <input type="date" id="endDate" class="date-input">
                    <button class="filter-btn" onclick="loadReports()">عرض</button>
                </div>
            </div>

            <!-- Summary Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(46, 213, 115, 0.1); color: #2ed573;">
                        <i class="fas fa-money-bill-wave"></i>
                    </div>
                    <div class="stat-info">
                        <h3>إجمالي المبيعات</h3>
                        <p id="total-sales">0 ر.س</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(255, 71, 87, 0.1); color: #ff4757;">
                        <i class="fas fa-wallet"></i>
                    </div>
                    <div class="stat-info">
                        <h3>المصروفات</h3>
                        <p id="total-expenses">0 ر.س</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(255, 165, 2, 0.1); color: #ffa502;">
                        <i class="fas fa-undo"></i>
                    </div>
                    <div class="stat-info">
                        <h3>المرتجعات</h3>
                        <p id="total-returns">0 ر.س</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(55, 66, 250, 0.1); color: #3742fa;">
                        <i class="fas fa-chart-line"></i>
                    </div>
                    <div class="stat-info">
                        <h3>صافي الربح</h3>
                        <p id="net-profit">0 ر.س</p>
                    </div>
                </div>
            </div>

            <!-- Shifts Report -->
            <div class="report-section">
                <div class="section-header">
                    <h2 class="section-title">سجل الورديات</h2>
                </div>
                <div style="overflow-x: auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>رقم الوردية</th>
                                <th>الموظف</th>
                                <th>وقت البدء</th>
                                <th>وقت الانتهاء</th>
                                <th>بداية الصندوق</th>
                                <th>نهاية الصندوق</th>
                                <th>الحالة</th>
                            </tr>
                        </thead>
                        <tbody id="shifts-table">
                            <!-- Shifts will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Recent Invoices -->
            <div class="report-section">
                <div class="section-header">
                    <h2 class="section-title">أحدث الفواتير</h2>
                </div>
                <div style="overflow-x: auto;">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>رقم الفاتورة</th>
                                <th>التاريخ</th>
                                <th>العميل</th>
                                <th>المبلغ</th>
                                <th>النوع</th>
                            </tr>
                        </thead>
                        <tbody id="invoices-table">
                            <!-- Invoices will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initAdminLayout } from '../../js/admin/layout.js';
        import { supabase } from '../../js/supabase-client.js';
        import { formatPrice } from '../../js/utils.js';

        initAdminLayout('reports.html');

        // Set default dates (Today)
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('startDate').value = today;
        document.getElementById('endDate').value = today;

        window.loadReports = async () => {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;

            // Adjust end date to include the full day
            const endDateTime = new Date(endDate);
            endDateTime.setHours(23, 59, 59, 999);

            try {
                // 1. Fetch Invoices (Sales & Returns)
                const { data: invoices, error: invError } = await supabase
                    .from('invoices')
                    .select('*')
                    .gte('created_at', startDate)
                    .lte('created_at', endDateTime.toISOString())
                    .order('created_at', { ascending: false });

                if (invError) throw invError;

                // 2. Fetch Expenses
                const { data: expenses, error: expError } = await supabase
                    .from('expenses')
                    .select('*')
                    .gte('created_at', startDate)
                    .lte('created_at', endDateTime.toISOString());

                if (expError) throw expError;

                // 3. Fetch Shifts
                const { data: shifts, error: shiftError } = await supabase
                    .from('shifts')
                    .select('*, user_profiles(full_name)')
                    .gte('start_time', startDate)
                    .lte('start_time', endDateTime.toISOString())
                    .order('start_time', { ascending: false });

                if (shiftError) throw shiftError;

                // Calculate Totals
                const totalSales = invoices
                    .filter(inv => inv.type === 'sale')
                    .reduce((sum, inv) => sum + inv.total_amount, 0);

                const totalReturns = invoices
                    .filter(inv => inv.type === 'return')
                    .reduce((sum, inv) => sum + inv.total_amount, 0);

                const totalExpenses = expenses.reduce((sum, exp) => sum + exp.amount, 0);

                const netProfit = totalSales - totalReturns - totalExpenses;

                // Update UI Cards
                document.getElementById('total-sales').textContent = formatPrice(totalSales);
                document.getElementById('total-returns').textContent = formatPrice(totalReturns);
                document.getElementById('total-expenses').textContent = formatPrice(totalExpenses);
                document.getElementById('net-profit').textContent = formatPrice(netProfit);

                // Update Shifts Table
                const shiftsTable = document.getElementById('shifts-table');
                shiftsTable.innerHTML = shifts.map(shift => `
                    <tr>
                        <td>#${shift.id}</td>
                        <td>${shift.user_profiles?.full_name || 'غير معروف'}</td>
                        <td>${new Date(shift.start_time).toLocaleString('ar-SA')}</td>
                        <td>${shift.end_time ? new Date(shift.end_time).toLocaleString('ar-SA') : '-'}</td>
                        <td>${formatPrice(shift.start_cash)}</td>
                        <td>${shift.end_cash ? formatPrice(shift.end_cash) : '-'}</td>
                        <td><span class="status-badge ${shift.status === 'open' ? 'status-open' : 'status-closed'}">
                            ${shift.status === 'open' ? 'مفتوحة' : 'مغلقة'}
                        </span></td>
                    </tr>
                `).join('') || '<tr><td colspan="7" style="text-align:center; padding: 20px; color: var(--text-secondary);">لا توجد ورديات</td></tr>';

                // Update Invoices Table
                const invoicesTable = document.getElementById('invoices-table');
                invoicesTable.innerHTML = invoices.slice(0, 20).map(inv => `
                    <tr>
                        <td>#${inv.id.slice(0, 8)}</td>
                        <td>${new Date(inv.created_at).toLocaleString('ar-SA')}</td>
                        <td>${inv.customer_name || 'عميل عام'}</td>
                        <td style="color: ${inv.type === 'return' ? '#ff4757' : '#2ed573'}">
                            ${inv.type === 'return' ? '-' : ''}${formatPrice(inv.total_amount)}
                        </td>
                        <td>${inv.type === 'sale' ? 'بيع' : 'مرتجع'}</td>
                    </tr>
                `).join('') || '<tr><td colspan="5" style="text-align:center; padding: 20px; color: var(--text-secondary);">لا توجد فواتير</td></tr>';

            } catch (error) {
                console.error('Error loading reports:', error);
            }
        };

        // Initial Load
        loadReports();
    </script>
</body>

</html>
