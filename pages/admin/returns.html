<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المرتجعات - لوحة التحكم</title>
    <!-- CSS is injected by layout.js, but we include it here for faster initial paint -->
    <link rel="stylesheet" href="../../css/admin-theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Page Specific Overrides */
        .search-section {
            background: var(--bg-card);
            padding: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            margin-bottom: 30px;
            display: flex;
            gap: 12px;
            border: 1px solid var(--border-color);
        }

        .search-input {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            background: var(--bg-main);
            color: var(--text-main);
        }

        .search-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            padding: 0 30px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-btn:hover {
            background: var(--primary-dark);
        }

        .invoice-details {
            display: none;
            background: var(--bg-card);
            padding: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .invoice-details.active {
            display: block;
        }

        .item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-btn:hover {
            background: var(--bg-hover);
        }

        .return-btn {
            background: var(--danger);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            padding: 12px 30px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            transition: 0.2s;
        }

        .return-btn:hover {
            background: #c0392b;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <!-- Main Content -->
        <main class="main-content">
            <!-- Header is injected by layout.js -->

            <!-- Statistics Cards -->
            <div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
                <div class="stat-card" style="background: var(--bg-card); padding: 20px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);">
                    <div style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 8px;">مرتجعات اليوم</div>
                    <div id="returns-today" style="font-size: 1.5rem; font-weight: 800; color: var(--primary);">0</div>
                </div>
                <div class="stat-card" style="background: var(--bg-card); padding: 20px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);">
                    <div style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 8px;">قيمة المرتجعات اليوم</div>
                    <div id="returns-value-today" style="font-size: 1.5rem; font-weight: 800; color: var(--danger);">0.00 ج.م</div>
                </div>
                <div class="stat-card" style="background: var(--bg-card); padding: 20px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);">
                    <div style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 8px;">مرتجعات هذا الشهر</div>
                    <div id="returns-month" style="font-size: 1.5rem; font-weight: 800; color: var(--warning);">0</div>
                </div>
            </div>

            <div class="search-section">
                <input type="text" id="invoice-id" class="search-input" placeholder="أدخل رقم الفاتورة (UUID)">
                <button class="search-btn" onclick="searchInvoice()">بحث</button>
            </div>

            <!-- Returns History -->
            <div style="background: var(--bg-card); padding: 24px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); margin-bottom: 30px; border: 1px solid var(--border-color);">
                <h3 style="margin-bottom: 20px; color: var(--text-main);">سجل المرتجعات</h3>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>رقم فاتورة المرتجع</th>
                                <th>التاريخ</th>
                                <th>العميل</th>
                                <th>المبلغ</th>
                                <th>عدد المنتجات</th>
                            </tr>
                        </thead>
                        <tbody id="returns-history">
                            <!-- Returns history loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="invoice-details" class="invoice-details">
                <h3 style="margin-bottom: 20px; color: var(--text-main);">تفاصيل الفاتورة</h3>
                <div id="items-container">
                    <!-- Items loaded here -->
                </div>
                <div style="margin-top: 20px; font-weight: 700; font-size: 1.2rem; color: var(--text-main);">
                    إجمالي الاسترداد: <span id="refund-total">0.00</span> ج.م
                </div>
                <div class="form-group" style="margin-top: 20px;">
                    <label class="form-label">سبب الاسترجاع (اختياري)</label>
                    <select id="return-reason" class="form-select">
                        <option value="">اختر السبب...</option>
                        <option value="defective">منتج معيب</option>
                        <option value="wrong_item">منتج خاطئ</option>
                        <option value="customer_changed_mind">العميل غير رأيه</option>
                        <option value="damaged">تالف أثناء الشحن</option>
                        <option value="other">أخرى</option>
                    </select>
                </div>
                <button class="return-btn" onclick="processReturn()">إتمام الاسترجاع</button>
            </div>
        </main>
    </div>

    <script type="module">
        import { initAdminLayout } from '../../js/admin/layout.js';
        import { supabase } from '../../js/supabase-client.js';
        import { formatPrice } from '../../js/utils.js';
        import { showSuccess, showError, confirm } from '../../js/toast.js';
        import { POSSystem } from '../../js/pos.js';

        initAdminLayout('returns');
        const pos = new POSSystem();

        let currentInvoice = null;
        let returnItems = {}; // { productId: quantityToReturn }

        // Load Statistics
        async function loadStatistics() {
            const today = new Date().toISOString().split('T')[0];
            const startOfMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString();

            // Returns today
            const { data: returnsToday } = await supabase
                .from('invoices')
                .select('total_amount')
                .eq('type', 'return')
                .gte('created_at', today);

            const countToday = returnsToday?.length || 0;
            const valueToday = returnsToday?.reduce((sum, r) => sum + r.total_amount, 0) || 0;

            // Returns this month
            const { data: returnsMonth } = await supabase
                .from('invoices')
                .select('id')
                .eq('type', 'return')
                .gte('created_at', startOfMonth);

            const countMonth = returnsMonth?.length || 0;

            document.getElementById('returns-today').textContent = countToday;
            document.getElementById('returns-value-today').textContent = formatPrice(valueToday);
            document.getElementById('returns-month').textContent = countMonth;

            // Load recent returns
            const { data: recentReturns } = await supabase
                .from('invoices')
                .select('*, invoice_items(quantity)')
                .eq('type', 'return')
                .order('created_at', { ascending: false })
                .limit(20);

            const historyTable = document.getElementById('returns-history');
            historyTable.innerHTML = recentReturns?.map(ret => `
                <tr>
                    <td>#${ret.id.slice(0, 8)}</td>
                    <td>${new Date(ret.created_at).toLocaleString('ar-EG')}</td>
                    <td>${ret.customer_name || 'عميل عام'}</td>
                    <td style="color: var(--danger);">${formatPrice(ret.total_amount)}</td>
                    <td>${ret.invoice_items?.reduce((sum, i) => sum + i.quantity, 0) || 0}</td>
                </tr>
            `).join('') || '<tr><td colspan="5" style="text-align:center; padding: 20px; color: var(--text-secondary);">لا توجد مرتجعات</td></tr>';
        }

        loadStatistics();

        window.searchInvoice = async () => {
            const id = document.getElementById('invoice-id').value.trim();
            if (!id) return;

            const { data, error } = await supabase
                .from('invoices')
                .select('*, invoice_items(*, products(title))')
                .eq('id', id)
                .single();

            if (error || !data) {
                showError('الفاتورة غير موجودة');
                return;
            }

            if (data.type === 'return') {
                showError('لا يمكن استرجاع فاتورة مرتجعة');
                return;
            }

            currentInvoice = data;
            renderItems();
            document.getElementById('invoice-details').classList.add('active');
        };

        function renderItems() {
            const container = document.getElementById('items-container');
            container.innerHTML = currentInvoice.invoice_items.map(item => `
                <div class="item-row">
                    <div>
                        <div style="font-weight: 700;">${item.products?.title || 'منتج'}</div>
                        <div style="color: var(--gray-dark);">${formatPrice(item.price)}</div>
                    </div>
                    <div class="qty-control">
                        <span>الكمية المشتراة: ${item.quantity}</span>
                        <span style="margin: 0 10px;">|</span>
                        <span>استرجاع: </span>
                        <button class="qty-btn" onclick="updateReturnQty('${item.product_id}', -1, ${item.price})">-</button>
                        <span id="qty-${item.product_id}">0</span>
                        <button class="qty-btn" onclick="updateReturnQty('${item.product_id}', 1, ${item.price}, ${item.quantity})">+</button>
                    </div>
                </div>
            `).join('');
            returnItems = {};
            updateTotal();
        }

        window.updateReturnQty = (productId, change, price, max) => {
            const current = returnItems[productId] || 0;
            let newQty = current + change;

            if (newQty < 0) newQty = 0;
            if (max && newQty > max) newQty = max;

            returnItems[productId] = newQty;
            document.getElementById(`qty-${productId}`).textContent = newQty;
            updateTotal();
        };

        function updateTotal() {
            let total = 0;
            currentInvoice.invoice_items.forEach(item => {
                const qty = returnItems[item.product_id] || 0;
                total += qty * item.price;
            });
            document.getElementById('refund-total').textContent = total.toFixed(2);
        }

        window.processReturn = async () => {
            const itemsToReturn = [];
            let totalRefund = 0;

            for (const [productId, qty] of Object.entries(returnItems)) {
                if (qty > 0) {
                    const originalItem = currentInvoice.invoice_items.find(i => i.product_id === productId);
                    itemsToReturn.push({
                        product_id: productId,
                        quantity: qty,
                        price: originalItem.price,
                        cost: originalItem.cost || 0
                    });
                    totalRefund += qty * originalItem.price;
                }
            }

            if (itemsToReturn.length === 0) {
                showError('الرجاء تحديد منتجات للاسترجاع');
                return;
            }

            if (await confirm(`هل أنت متأكد من استرجاع منتجات بقيمة ${formatPrice(totalRefund)}؟`)) {
                try {
                    // 1. Create Return Invoice
                    const { data: returnInv, error: invError } = await supabase
                        .from('invoices')
                        .insert({
                            shift_id: currentInvoice.shift_id, // Ideally current open shift, but for now link to original or null
                            user_id: currentInvoice.user_id,
                            customer_name: currentInvoice.customer_name,
                            total_amount: totalRefund,
                            payment_method: 'cash', // Assume cash refund
                            type: 'return'
                        })
                        .select()
                        .single();

                    if (invError) throw invError;

                    // 2. Add Return Items
                    const returnItemsData = itemsToReturn.map(item => ({
                        invoice_id: returnInv.id,
                        product_id: item.product_id,
                        quantity: item.quantity,
                        price: item.price,
                        cost: item.cost
                    }));

                    const { error: itemsError } = await supabase.from('invoice_items').insert(returnItemsData);
                    if (itemsError) throw itemsError;

                    // 3. Update Stock (Increase)
                    for (const item of itemsToReturn) {
                        // Fetch current stock first to be safe
                        const { data: prod } = await supabase.from('products').select('stock').eq('id', item.product_id).single();
                        if (prod) {
                            await supabase.from('products').update({ stock: prod.stock + item.quantity }).eq('id', item.product_id);
                        }
                    }

                    showSuccess('تمت عملية الاسترجاع بنجاح');
                    document.getElementById('invoice-details').classList.remove('active');
                    document.getElementById('invoice-id').value = '';

                } catch (error) {
                    console.error(error);
                    showError('حدث خطأ أثناء الاسترجاع');
                }
            }
        };

        // Initial load
        loadStatistics();
    </script>
</body>

</html>
