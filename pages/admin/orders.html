<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الطلبات - لوحة التحكم</title>
    <!-- CSS is injected by layout.js, but we include it here for faster initial paint -->
    <link rel="stylesheet" href="../../css/admin-theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Page Specific Overrides */
        .orders-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            padding: 24px;
            border: 1px solid var(--border-color);
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .filter-btn {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: white;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            display: inline-block;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-processing {
            background: #cce5ff;
            color: #004085;
        }

        .status-shipped {
            background: #d4edda;
            color: #155724;
        }

        .status-delivered {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .action-btn {
            padding: 6px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: white;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
        }

        .action-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .order-detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .order-detail-label {
            font-weight: 600;
            color: var(--text-secondary);
        }

        .order-products {
            margin-top: 24px;
            background: var(--bg-main);
            padding: 20px;
            border-radius: var(--radius-md);
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <!-- Main Content -->
        <main class="main-content">
            <!-- Header is injected by layout.js -->

            <div class="orders-card">
                <div class="filters">
                    <button class="filter-btn active" data-status="all">الكل</button>
                    <button class="filter-btn" data-status="pending">قيد الانتظار</button>
                    <button class="filter-btn" data-status="processing">قيد التنفيذ</button>
                    <button class="filter-btn" data-status="shipped">تم الشحن</button>
                    <button class="filter-btn" data-status="delivered">تم التوصيل</button>
                    <button class="filter-btn" data-status="cancelled">ملغي</button>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>رقم الطلب</th>
                                <th>العميل</th>
                                <th>المبلغ الإجمالي</th>
                                <th>التاريخ</th>
                                <th>الحالة</th>
                                <th>إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                            <!-- Orders will be loaded here -->
                        </tbody>
                    </table>
                </div>

                <div id="loading" style="padding: 40px; text-align: center;">
                    <div class="spinner"
                        style="border: 4px solid rgba(0,0,0,0.1); border-left-color: var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto;">
                    </div>
                    <p style="margin-top: 10px; color: var(--text-secondary);">جاري تحميل الطلبات...</p>
                    <style>
                        @keyframes spin {
                            0% {
                                transform: rotate(0deg);
                            }

                            100% {
                                transform: rotate(360deg);
                            }
                        }
                    </style>
                </div>

                <div id="noResults"
                    style="display: none; text-align: center; padding: 40px; color: var(--text-secondary);">
                    لا توجد طلبات
                </div>
            </div>
        </main>
    </div>

    <!-- Order Details Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">تفاصيل الطلب #<span id="modalOrderId"></span></h3>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>

            <div class="order-detail-row">
                <span class="order-detail-label">العميل:</span>
                <span id="modalCustomerName"></span>
            </div>
            <div class="order-detail-row">
                <span class="order-detail-label">رقم الهاتف:</span>
                <span id="modalPhone"></span>
            </div>
            <div class="order-detail-row">
                <span class="order-detail-label">العنوان:</span>
                <span id="modalAddress"></span>
            </div>
            <div class="order-detail-row">
                <span class="order-detail-label">طريقة الدفع:</span>
                <span id="modalPayment"></span>
            </div>
            <div class="order-detail-row">
                <span class="order-detail-label">تاريخ الطلب:</span>
                <span id="modalDate"></span>
            </div>

            <div style="margin: 24px 0;">
                <label style="display: block; margin-bottom: 10px; font-weight: 600;">تحديث الحالة:</label>
                <select id="modalStatusSelect" class="form-select">
                    <option value="pending">قيد الانتظار</option>
                    <option value="processing">قيد التنفيذ</option>
                    <option value="shipped">تم الشحن</option>
                    <option value="delivered">تم التوصيل</option>
                    <option value="cancelled">ملغي</option>
                </select>
            </div>

            <div class="order-products">
                <h4 style="margin-bottom: 16px; font-weight: 700;">المنتجات</h4>
                <div id="modalProductsList"></div>
                <div
                    style="border-top: 1px solid var(--border-color); margin-top: 16px; padding-top: 16px; display: flex; justify-content: space-between; font-weight: 700;">
                    <span>الإجمالي</span>
                    <span id="modalTotal" style="color: var(--primary);"></span>
                </div>
            </div>

            <div style="margin-top: 24px;">
                <button id="saveStatusBtn" class="btn btn-primary" style="width: 100%;">حفظ التغييرات</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initAdminLayout } from '../../js/admin/layout.js';
        initAdminLayout('orders.html');
    </script>
    <script type="module" src="../../js/admin/orders.js"></script>
</body>

</html>
