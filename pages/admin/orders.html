<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الطلبات - لوحة التحكم</title>
    <link rel="stylesheet" href="../../css/admin-theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Page Specific Overrides */
        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .filter-btn {
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: white;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .order-detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .order-detail-label {
            font-weight: 600;
            color: var(--text-secondary);
        }

        .order-products {
            margin-top: 24px;
            background: var(--bg-main);
            padding: 20px;
            border-radius: var(--radius-md);
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <main class="main-content">
            <!-- Header Area -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <div>
                    <h1 style="font-size: 1.5rem; font-weight: 700; color: #111827; margin-bottom: 4px;">الطلبات</h1>
                    <p style="color: #6b7280; font-size: 0.9rem;">متابعة وإدارة طلبات العملاء</p>
                </div>
            </div>

            <!-- Statistics Cards -->
            <div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 24px;">
                <div class="stat-card" style="background: var(--bg-card); padding: 20px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);">
                    <div style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 8px;">طلبات اليوم</div>
                    <div id="orders-today" style="font-size: 1.5rem; font-weight: 800; color: var(--primary);">0</div>
                </div>
                <div class="stat-card" style="background: var(--bg-card); padding: 20px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);">
                    <div style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 8px;">قيد الانتظار</div>
                    <div id="orders-pending" style="font-size: 1.5rem; font-weight: 800; color: var(--warning);">0</div>
                </div>
                <div class="stat-card" style="background: var(--bg-card); padding: 20px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);">
                    <div style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 8px;">إيرادات اليوم</div>
                    <div id="revenue-today" style="font-size: 1.5rem; font-weight: 800; color: var(--success);">0.00 ج.م</div>
                </div>
            </div>

            <div class="card">
                <div class="filters">
                    <button class="filter-btn active" data-status="all">الكل</button>
                    <button class="filter-btn" data-status="pending">قيد الانتظار</button>
                    <button class="filter-btn" data-status="processing">قيد التنفيذ</button>
                    <button class="filter-btn" data-status="shipped">تم الشحن</button>
                    <button class="filter-btn" data-status="delivered">تم التوصيل</button>
                    <button class="filter-btn" data-status="cancelled">ملغي</button>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>رقم الطلب</th>
                                <th>العميل</th>
                                <th>المبلغ الإجمالي</th>
                                <th>التاريخ</th>
                                <th>الحالة</th>
                                <th>إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                            <!-- Orders will be loaded here -->
                        </tbody>
                    </table>
                </div>

                <div id="loading" style="padding: 60px; text-align: center;">
                    <div class="spinner" style="border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
                    <p style="color: #6b7280;">جاري تحميل الطلبات...</p>
                </div>

                <div id="noResults" style="display: none; text-align: center; padding: 40px; color: #6b7280;">
                    لا توجد طلبات
                </div>
            </div>
        </main>
    </div>

    <!-- Order Details Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">تفاصيل الطلب #<span id="modalOrderId"></span></h3>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>

            <div class="order-detail-row">
                <span class="order-detail-label">العميل:</span>
                <span id="modalCustomerName"></span>
            </div>
            <div class="order-detail-row">
                <span class="order-detail-label">رقم الهاتف:</span>
                <span id="modalPhone"></span>
            </div>
            <div class="order-detail-row">
                <span class="order-detail-label">العنوان:</span>
                <span id="modalAddress"></span>
            </div>
            <div class="order-detail-row">
                <span class="order-detail-label">طريقة الدفع:</span>
                <span id="modalPayment"></span>
            </div>
            <div class="order-detail-row">
                <span class="order-detail-label">تاريخ الطلب:</span>
                <span id="modalDate"></span>
            </div>

            <div style="margin: 24px 0;">
                <label style="display: block; margin-bottom: 10px; font-weight: 600;">تحديث الحالة:</label>
                <select id="modalStatusSelect" class="form-select">
                    <option value="pending">قيد الانتظار</option>
                    <option value="processing">قيد التنفيذ</option>
                    <option value="shipped">تم الشحن</option>
                    <option value="delivered">تم التوصيل</option>
                    <option value="cancelled">ملغي</option>
                </select>
            </div>

            <div class="order-products">
                <h4 style="margin-bottom: 16px; font-weight: 700;">المنتجات</h4>
                <div id="modalProductsList"></div>
                <div style="border-top: 1px solid var(--border-color); margin-top: 16px; padding-top: 16px; display: flex; justify-content: space-between; font-weight: 700;">
                    <span>الإجمالي</span>
                    <span id="modalTotal" style="color: var(--primary);"></span>
                </div>
            </div>

            <div style="margin-top: 24px;">
                <button id="saveStatusBtn" class="btn btn-primary" style="width: 100%;">حفظ التغييرات</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initAdminLayout } from '../../js/admin/layout.js';
        initAdminLayout('orders');
    </script>
    <script type="module" src="../../js/admin/orders.js"></script>
</body>

</html>
