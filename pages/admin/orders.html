<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الطلبات - لوحة التحكم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../Front-End/Appearance/index.css">
    <style>
        body {
            background: var(--gray);
        }

        .dashboard-container {
            display: flex;
            min-height: 100vh;
            padding-top: 80px;
        }

        .sidebar {
            width: 280px;
            background: var(--white);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-md);
            position: fixed;
            right: 0;
            top: 80px;
            bottom: 0;
            overflow-y: auto;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-md);
            border-radius: var(--radius-lg);
            color: var(--black);
            transition: var(--transition-base);
            font-weight: 600;
        }

        .sidebar-item:hover,
        .sidebar-item.active {
            background: var(--primary);
            color: var(--white);
        }

        .sidebar-item i {
            width: 24px;
            text-align: center;
        }

        .main-content {
            flex: 1;
            margin-right: 280px;
            padding: var(--spacing-xl);
        }

        .dashboard-card {
            background: var(--white);
            padding: var(--spacing-xl);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
            margin-bottom: var(--spacing-lg);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 2px solid var(--gray);
            flex-wrap: wrap;
            gap: 10px;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--black);
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid var(--gray);
            background: white;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 16px;
            text-align: right;
            border-bottom: 1px solid var(--gray);
        }

        .data-table th {
            font-weight: 700;
            color: var(--gray-dark);
            font-size: 0.9rem;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-processing {
            background: #cce5ff;
            color: #004085;
        }

        .status-shipped {
            background: #d4edda;
            color: #155724;
        }

        .status-delivered {
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .action-btn {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--gray);
            background: white;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            margin-left: 5px;
        }

        .action-btn:hover {
            background: var(--gray);
            color: var(--primary);
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            left: 20px;
            top: 20px;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--gray-dark);
        }

        .order-detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--gray);
        }

        .order-detail-label {
            font-weight: 600;
            color: var(--gray-dark);
        }

        .order-products {
            margin-top: 20px;
            background: var(--gray);
            padding: 15px;
            border-radius: 12px;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: static;
            }

            .main-content {
                margin-right: 0;
            }

            .dashboard-container {
                flex-direction: column;
            }

            .data-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header>
        <div class="logo">
            <a href="../../index.html" style="text-decoration: none;">
                <img src="../../assets/images/logo.png" alt="هديتي" style="height: 50px;">
            </a>
        </div>
        <div style="display: flex; align-items: center; gap: 16px;">
            <span style="font-weight: 600; color: var(--gray-dark);">لوحة التحكم</span>
            <a href="../../index.html" class="btn" style="padding: 8px 16px;">
                <i class="fas fa-home"></i> الموقع الرئيسي
            </a>
        </div>
    </header>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-menu">
                <a href="admin.html" class="sidebar-item">
                    <i class="fas fa-chart-line"></i>
                    <span>الإحصائيات</span>
                </a>
                <a href="products.html" class="sidebar-item">
                    <i class="fas fa-box"></i>
                    <span>المنتجات</span>
                </a>
                <a href="orders.html" class="sidebar-item active">
                    <i class="fas fa-shopping-cart"></i>
                    <span>الطلبات</span>
                </a>
                <a href="users.html" class="sidebar-item">
                    <i class="fas fa-users"></i>
                    <span>المستخدمين</span>
                </a>
                <div style="height: 1px; background: var(--gray); margin: 16px 0;"></div>
                <a href="settings.html" class="sidebar-item">
                    <i class="fas fa-cog"></i>
                    <span>الإعدادات</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dashboard-card">
                <div class="card-header">
                    <h2 class="card-title">إدارة الطلبات</h2>
                    <div class="filters">
                        <button class="filter-btn active" data-status="all">الكل</button>
                        <button class="filter-btn" data-status="pending">قيد الانتظار</button>
                        <button class="filter-btn" data-status="processing">قيد التنفيذ</button>
                        <button class="filter-btn" data-status="shipped">تم الشحن</button>
                        <button class="filter-btn" data-status="delivered">تم التوصيل</button>
                        <button class="filter-btn" data-status="cancelled">ملغي</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>رقم الطلب</th>
                                <th>العميل</th>
                                <th>المبلغ الإجمالي</th>
                                <th>التاريخ</th>
                                <th>الحالة</th>
                                <th>إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                            <!-- Orders will be loaded here -->
                        </tbody>
                    </table>
                </div>

                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <p>جاري تحميل الطلبات...</p>
                </div>

                <div id="noResults" style="display: none; text-align: center; padding: 20px; color: var(--gray-dark);">
                    لا توجد طلبات
                </div>
            </div>
        </main>
    </div>

    <!-- Order Details Modal -->
    <div id="orderModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" id="closeModal"><i class="fas fa-times"></i></button>
            <h3 style="margin-bottom: 20px; font-size: 1.5rem;">تفاصيل الطلب #<span id="modalOrderId"></span></h3>

            <div class="order-detail-row">
                <span class="order-detail-label">العميل:</span>
                <span id="modalCustomerName"></span>
            </div>
            <div class="order-detail-row">
                <span class="order-detail-label">رقم الهاتف:</span>
                <span id="modalPhone"></span>
            </div>
            <div class="order-detail-row">
                <span class="order-detail-label">العنوان:</span>
                <span id="modalAddress"></span>
            </div>
            <div class="order-detail-row">
                <span class="order-detail-label">طريقة الدفع:</span>
                <span id="modalPayment"></span>
            </div>
            <div class="order-detail-row">
                <span class="order-detail-label">تاريخ الطلب:</span>
                <span id="modalDate"></span>
            </div>

            <div style="margin: 20px 0;">
                <label style="display: block; margin-bottom: 8px; font-weight: 600;">تحديث الحالة:</label>
                <select id="modalStatusSelect"
                    style="width: 100%; padding: 10px; border: 1px solid var(--gray); border-radius: 8px;">
                    <option value="pending">قيد الانتظار</option>
                    <option value="processing">قيد التنفيذ</option>
                    <option value="shipped">تم الشحن</option>
                    <option value="delivered">تم التوصيل</option>
                    <option value="cancelled">ملغي</option>
                </select>
            </div>

            <div class="order-products">
                <h4 style="margin-bottom: 10px;">المنتجات</h4>
                <div id="modalProductsList"></div>
                <div
                    style="border-top: 1px solid #ddd; margin-top: 10px; padding-top: 10px; display: flex; justify-content: space-between; font-weight: 700;">
                    <span>الإجمالي</span>
                    <span id="modalTotal"></span>
                </div>
            </div>

            <div style="margin-top: 20px; text-align: left;">
                <button id="saveStatusBtn" class="btn">حفظ التغييرات</button>
            </div>
        </div>
    </div>

    <script type="module" src="../../js/admin/orders.js"></script>
</body>

</html>
