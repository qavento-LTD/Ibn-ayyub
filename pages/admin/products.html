<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المنتجات - لوحة التحكم</title>
    <!-- CSS is injected by layout.js, but we include it here for faster initial paint -->
    <link rel="stylesheet" href="../../css/admin-theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Page Specific Overrides */
        .products-grid {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .product-img {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            background: #eee;
            border: 1px solid var(--border-color);
        }

        .stock-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .stock-high {
            background: #d1e7dd;
            color: #0f5132;
        }

        .stock-low {
            background: #fff3cd;
            color: #856404;
        }

        .stock-out {
            background: #f8d7da;
            color: #721c24;
        }

        .action-btn {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: white;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .action-btn.delete:hover {
            background: var(--danger);
            border-color: var(--danger);
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <!-- Main Content -->
        <main class="main-content">
            <!-- Header is injected by layout.js -->

            <div
                style="display: flex; justify-content: flex-end; margin-bottom: 20px; margin-top: -60px; position: relative; z-index: 901; pointer-events: none;">
                <!-- Hack to place button in header area if needed, or just keep it in main content -->
            </div>
            <!-- We'll keep the button in the main flow for now, but maybe move it to header actions later via JS -->

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <!-- Search or Filters could go here -->
                <div></div>
                <button class="btn btn-primary" onclick="openModal()">
                    <i class="fas fa-plus"></i> إضافة منتج
                </button>
            </div>

            <div class="products-grid">
                <div class="table-container">
                    <table class="data-table" id="products-table">
                        <thead>
                            <tr>
                                <th>المنتج</th>
                                <th>السعر</th>
                                <th>المخزون</th>
                                <th>القسم</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="products-container">
                            <!-- Products will be loaded here -->
                        </tbody>
                    </table>
                </div>
                <div id="loading" style="padding: 40px; text-align: center;">
                    <div class="spinner"
                        style="border: 4px solid rgba(0,0,0,0.1); border-left-color: var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto;">
                    </div>
                    <style>
                        @keyframes spin {
                            0% {
                                transform: rotate(0deg);
                            }

                            100% {
                                transform: rotate(360deg);
                            }
                        }
                    </style>
                </div>
            </div>
        </main>
    </div>

    <!-- Product Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">إضافة منتج جديد</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>

            <form id="product-form">
                <input type="hidden" id="product-id">

                <div class="form-group">
                    <label class="form-label">اسم المنتج</label>
                    <input type="text" id="product-title" class="form-input" required>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">السعر</label>
                        <input type="number" id="product-price" class="form-input" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">تكلفة الشراء</label>
                        <input type="number" id="product-cost" class="form-input" step="0.01">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">المخزون</label>
                        <input type="number" id="product-stock" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">الباركود</label>
                        <input type="text" id="product-barcode" class="form-input" placeholder="امسح الباركود هنا...">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">القسم</label>
                    <select id="product-category" class="form-select" required>
                        <option value="">اختر القسم</option>
                        <option value="love-gifts">هدايا الحب</option>
                        <option value="birthday-gifts">أعياد الميلاد</option>
                        <option value="wedding-gifts">هدايا الزفاف</option>
                        <option value="graduation-gifts">هدايا التخرج</option>
                        <option value="home-gifts">هدايا المنزل</option>
                        <option value="kids-gifts">هدايا الأطفال</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">رابط الصورة</label>
                    <input type="url" id="product-image" class="form-input">
                </div>

                <div style="display: flex; gap: 12px; margin-top: 30px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">حفظ</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()"
                        style="flex: 1;">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initAdminLayout } from '../../js/admin/layout.js';
        import { supabase } from '../../js/supabase-client.js';
        import { formatPrice, isAdmin } from '../../js/utils.js';
        import { showSuccess, showError, confirm } from '../../js/toast.js';

        // Initialize Layout
        initAdminLayout('products.html');

        // Logic
        let currentProductId = null;

        async function loadProducts() {
            const container = document.getElementById('products-container');
            const loading = document.getElementById('loading');

            try {
                const { data: products, error } = await supabase
                    .from('products')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                loading.style.display = 'none';

                if (!products.length) {
                    container.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 30px; color: var(--text-secondary);">لا توجد منتجات</td></tr>';
                    return;
                }

                container.innerHTML = products.map(p => {
                    const stockClass = p.stock <= 0 ? 'stock-out' : p.stock <= 5 ? 'stock-low' : 'stock-high';
                    const stockText = p.stock <= 0 ? 'نفذت الكمية' : p.stock <= 5 ? `منخفض (${p.stock})` : `متوفر (${p.stock})`;

                    return `
                        <tr>
                            <td>
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    <img src="${p.image_url || '../../assets/images/logo.png'}" class="product-img" onerror="this.src='../../assets/images/logo.png'">
                                    <div>
                                        <div style="font-weight: 600; color: var(--text-main);">${p.title}</div>
                                        <div style="font-size: 0.8rem; color: var(--text-secondary);">${p.barcode || '-'}</div>
                                    </div>
                                </div>
                            </td>
                            <td style="font-weight: 700; color: var(--primary);">${formatPrice(p.price)}</td>
                            <td><span class="stock-badge ${stockClass}">${stockText}</span></td>
                            <td>${getCategoryName(p.category)}</td>
                            <td>
                                <button class="action-btn" onclick="window.editProduct('${p.id}')"><i class="fas fa-edit"></i></button>
                                <button class="action-btn delete" onclick="window.deleteProduct('${p.id}')"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (error) {
                console.error(error);
                loading.innerHTML = '<span style="color: var(--danger);">حدث خطأ في التحميل</span>';
            }
        }

        function getCategoryName(cat) {
            const map = {
                'love-gifts': 'هدايا الحب',
                'birthday-gifts': 'أعياد الميلاد',
                'wedding-gifts': 'هدايا الزفاف',
                'graduation-gifts': 'هدايا التخرج',
                'home-gifts': 'هدايا المنزل',
                'kids-gifts': 'هدايا الأطفال'
            };
            return map[cat] || cat;
        }

        window.openModal = async (id = null) => {
            const modal = document.getElementById('product-modal');
            const form = document.getElementById('product-form');
            const title = document.getElementById('modal-title');

            currentProductId = id;
            modal.classList.add('active');

            if (id) {
                title.textContent = 'تعديل المنتج';
                const { data } = await supabase.from('products').select('*').eq('id', id).single();
                if (data) {
                    document.getElementById('product-title').value = data.title;
                    document.getElementById('product-price').value = data.price;
                    document.getElementById('product-cost').value = data.cost_price || '';
                    document.getElementById('product-stock').value = data.stock;
                    document.getElementById('product-barcode').value = data.barcode || '';
                    document.getElementById('product-category').value = data.category;
                    document.getElementById('product-image').value = data.image_url || '';
                }
            } else {
                title.textContent = 'إضافة منتج جديد';
                form.reset();
            }
        };

        window.closeModal = () => {
            document.getElementById('product-modal').classList.remove('active');
        };

        window.editProduct = (id) => window.openModal(id);

        window.deleteProduct = async (id) => {
            if (await confirm('هل أنت متأكد من الحذف؟')) {
                await supabase.from('products').delete().eq('id', id);
                showSuccess('تم الحذف');
                loadProducts();
            }
        };

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                title: document.getElementById('product-title').value,
                price: document.getElementById('product-price').value,
                cost_price: document.getElementById('product-cost').value || 0,
                stock: document.getElementById('product-stock').value,
                barcode: document.getElementById('product-barcode').value || null,
                category: document.getElementById('product-category').value,
                image_url: document.getElementById('product-image').value || null
            };

            let error;
            if (currentProductId) {
                ({ error } = await supabase.from('products').update(data).eq('id', currentProductId));
            } else {
                ({ error } = await supabase.from('products').insert(data));
            }

            if (error) {
                showError('حدث خطأ');
                console.error(error);
            } else {
                showSuccess('تم الحفظ');
                closeModal();
                loadProducts();
            }
        });

        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>

</html>
