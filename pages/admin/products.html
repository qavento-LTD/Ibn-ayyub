<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المنتجات - لوحة التحكم</title>
    <style>
        /* Page Specific Overrides */
        .products-grid {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .product-img {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            object-fit: cover;
            background: #eee;
            border: 1px solid var(--border-color);
        }

        /* Image Upload Preview */
        .image-upload-container {
            border: 2px dashed #e5e7eb;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            background: #f9fafb;
        }

        .image-upload-container:hover {
            border-color: var(--primary);
            background: #f0f9ff;
        }

        .preview-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            display: none;
            margin: 0 auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .upload-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: #6b7280;
        }

        .upload-placeholder i {
            font-size: 2rem;
            color: #9ca3af;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <main class="main-content">
            <!-- Header Area -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <div>
                    <h1 style="font-size: 1.5rem; font-weight: 700; color: #111827; margin-bottom: 4px;">المنتجات</h1>
                    <p style="color: #6b7280; font-size: 0.9rem;">إدارة مخزون المنتجات والأسعار</p>
                </div>
                <button class="btn btn-primary" onclick="openModal()">
                    <i class="fas fa-plus"></i> إضافة منتج جديد
                </button>
            </div>

            <!-- Products Table -->
            <div class="products-grid">
                <div class="table-container">
                    <table class="data-table" id="products-table">
                        <thead>
                            <tr>
                                <th style="width: 40%;">المنتج</th>
                                <th>القسم</th>
                                <th>السعر</th>
                                <th>المخزون</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="products-container">
                            <!-- Products will be loaded here -->
                        </tbody>
                    </table>
                </div>
                <div id="loading" style="padding: 60px; text-align: center;">
                    <div class="spinner" style="border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
                    <p style="color: #6b7280;">جاري تحميل البيانات...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Product Modal -->
    <div id="product-modal" class="modal">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">إضافة منتج جديد</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>

            <form id="product-form">
                <input type="hidden" id="product-id">
                
                <!-- Image Upload -->
                <div class="form-group">
                    <label class="form-label">صورة المنتج</label>
                    <div class="image-upload-container" onclick="document.getElementById('product-image-file').click()">
                        <input type="file" id="product-image-file" accept="image/*" style="display: none;" onchange="handleFileSelect(this)">
                        <input type="hidden" id="product-image-url">
                        
                        <div id="upload-placeholder" class="upload-placeholder">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <span>اضغط لاختيار صورة من الجهاز</span>
                            <span style="font-size: 0.8rem; color: #9ca3af;">PNG, JPG, WEBP (Max 2MB)</span>
                        </div>
                        <img id="image-preview" class="preview-image">
                        
                        <div id="upload-loading" class="loading-overlay">
                            <div class="spinner" style="width: 30px; height: 30px; border: 3px solid #f3f3f3; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">اسم المنتج</label>
                    <input type="text" id="product-title" class="form-input" required placeholder="مثال: باقة ورد أحمر">
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">السعر</label>
                        <input type="number" id="product-price" class="form-input" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">تكلفة الشراء</label>
                        <input type="number" id="product-cost" class="form-input" step="0.01">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">المخزون</label>
                        <input type="number" id="product-stock" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">الباركود</label>
                        <input type="text" id="product-barcode" class="form-input" placeholder="Scan...">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">القسم</label>
                    <select id="product-category" class="form-select" required>
                        <option value="">اختر القسم</option>
                        <option value="love-gifts">هدايا الحب</option>
                        <option value="birthday-gifts">أعياد الميلاد</option>
                        <option value="wedding-gifts">هدايا الزفاف</option>
                        <option value="graduation-gifts">هدايا التخرج</option>
                        <option value="home-gifts">هدايا المنزل</option>
                        <option value="kids-gifts">هدايا الأطفال</option>
                    </select>
                </div>

                <div style="display: flex; gap: 12px; margin-top: 30px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1; justify-content: center;">
                        <span id="save-btn-text">حفظ التغييرات</span>
                        <div id="save-spinner" class="spinner" style="display: none; width: 20px; height: 20px; border: 2px solid white; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()" style="flex: 1; justify-content: center;">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initAdminLayout } from '../../js/admin/layout.js';
        import { supabase, uploadImage } from '../../js/supabase-client.js';
        import { formatPrice, isAdmin } from '../../js/utils.js';
        import { showSuccess, showError, confirm } from '../../js/toast.js';

        // Initialize Layout
        initAdminLayout('products');

        // Logic
        let currentProductId = null;
        let selectedFile = null;

        async function loadProducts() {
            const container = document.getElementById('products-container');
            const loading = document.getElementById('loading');

            try {
                const { data: products, error } = await supabase
                    .from('products')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                loading.style.display = 'none';

                if (!products.length) {
                    container.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px; color: #6b7280;">لا توجد منتجات مضافة حتى الآن</td></tr>';
                    return;
                }

                container.innerHTML = products.map(p => {
                    const stockClass = p.stock <= 0 ? 'badge-danger' : p.stock <= 5 ? 'badge-warning' : 'badge-success';
                    const stockText = p.stock <= 0 ? 'نفذت الكمية' : p.stock <= 5 ? 'منخفض' : 'متوفر';
                    
                    return `
                        <tr>
                            <td>
                                <div class="product-info-cell">
                                    <img src="${p.image_url || '../../assets/images/logo.png'}" class="product-img" onerror="this.src='../../assets/images/logo.png'">
                                    <div class="product-details">
                                        <div class="product-name">${p.title}</div>
                                        <div class="product-meta">${p.barcode || 'بدون باركود'}</div>
                                    </div>
                                </div>
                            </td>
                            <td><span class="badge badge-gray">${getCategoryName(p.category)}</span></td>
                            <td style="font-weight: 700; color: var(--primary);">${formatPrice(p.price)}</td>
                            <td>
                                <span class="badge ${stockClass}">
                                    ${stockText} (${p.stock})
                                </span>
                            </td>
                            <td>
                                <div class="action-buttons">
                                    <button class="btn-icon" onclick="window.editProduct('${p.id}')" title="تعديل">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="btn-icon delete" onclick="window.deleteProduct('${p.id}')" title="حذف">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (error) {
                console.error(error);
                loading.innerHTML = '<span style="color: var(--danger);">حدث خطأ في تحميل البيانات</span>';
            }
        }

        function getCategoryName(cat) {
            const map = {
                'love-gifts': 'هدايا الحب',
                'birthday-gifts': 'أعياد الميلاد',
                'wedding-gifts': 'هدايا الزفاف',
                'graduation-gifts': 'هدايا التخرج',
                'home-gifts': 'هدايا المنزل',
                'kids-gifts': 'هدايا الأطفال'
            };
            return map[cat] || cat;
        }

        // File Selection Handler
        window.handleFileSelect = (input) => {
            if (input.files && input.files[0]) {
                selectedFile = input.files[0];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const preview = document.getElementById('image-preview');
                    const placeholder = document.getElementById('upload-placeholder');
                    
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    placeholder.style.display = 'none';
                }
                
                reader.readAsDataURL(selectedFile);
            }
        };

        window.openModal = async (id = null) => {
            const modal = document.getElementById('product-modal');
            const form = document.getElementById('product-form');
            const title = document.getElementById('modal-title');
            const preview = document.getElementById('image-preview');
            const placeholder = document.getElementById('upload-placeholder');

            currentProductId = id;
            selectedFile = null;
            modal.classList.add('active');
            
            // Reset Image State
            preview.style.display = 'none';
            preview.src = '';
            placeholder.style.display = 'flex';
            document.getElementById('product-image-file').value = '';

            if (id) {
                title.textContent = 'تعديل المنتج';
                const { data } = await supabase.from('products').select('*').eq('id', id).single();
                if (data) {
                    document.getElementById('product-title').value = data.title;
                    document.getElementById('product-price').value = data.price;
                    document.getElementById('product-cost').value = data.cost_price || '';
                    document.getElementById('product-stock').value = data.stock;
                    document.getElementById('product-barcode').value = data.barcode || '';
                    document.getElementById('product-category').value = data.category;
                    document.getElementById('product-image-url').value = data.image_url || '';
                    
                    if (data.image_url) {
                        preview.src = data.image_url;
                        preview.style.display = 'block';
                        placeholder.style.display = 'none';
                    }
                }
            } else {
                title.textContent = 'إضافة منتج جديد';
                form.reset();
                document.getElementById('product-image-url').value = '';
            }
        };

        window.closeModal = () => {
            document.getElementById('product-modal').classList.remove('active');
        };

        window.editProduct = (id) => window.openModal(id);

        window.deleteProduct = async (id) => {
            if (await confirm('هل أنت متأكد من حذف هذا المنتج نهائياً؟')) {
                await supabase.from('products').delete().eq('id', id);
                showSuccess('تم حذف المنتج بنجاح');
                loadProducts();
            }
        };

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const saveBtn = e.target.querySelector('button[type="submit"]');
            const btnText = document.getElementById('save-btn-text');
            const spinner = document.getElementById('save-spinner');
            
            // Loading State
            saveBtn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';

            try {
                let imageUrl = document.getElementById('product-image-url').value;

                // Handle Image Upload if file selected
                if (selectedFile) {
                    const uploadResult = await uploadImage(selectedFile);
                    if (uploadResult.error) {
                        throw new Error('فشل رفع الصورة: ' + uploadResult.error.message);
                    }
                    imageUrl = uploadResult.publicUrl;
                }

                const data = {
                    title: document.getElementById('product-title').value,
                    price: document.getElementById('product-price').value,
                    cost_price: document.getElementById('product-cost').value || 0,
                    stock: document.getElementById('product-stock').value,
                    barcode: document.getElementById('product-barcode').value || null,
                    category: document.getElementById('product-category').value,
                    image_url: imageUrl || null
                };

                let error;
                if (currentProductId) {
                    ({ error } = await supabase.from('products').update(data).eq('id', currentProductId));
                } else {
                    ({ error } = await supabase.from('products').insert(data));
                }

                if (error) throw error;

                showSuccess('تم حفظ المنتج بنجاح');
                closeModal();
                loadProducts();

            } catch (error) {
                console.error(error);
                showError(error.message || 'حدث خطأ أثناء الحفظ');
            } finally {
                // Reset Loading State
                saveBtn.disabled = false;
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        });

        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>

</html>
