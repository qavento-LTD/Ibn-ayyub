<!-- Keyboard Shortcuts Modal Component -->
<div class="modal" id="shortcuts-modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title">اختصارات لوحة المفاتيح</h3>
            <button class="close-modal" onclick="closeModal('shortcuts-modal')">&times;</button>
        </div>
        <div class="grid-2">
            <div style="padding: 10px; background: #f8f9fa; border-radius: 8px;">
                <strong>F2</strong> <span style="float: left;">بحث عن منتج</span>
            </div>
            <div style="padding: 10px; background: #f8f9fa; border-radius: 8px;">
                <strong>F9</strong> <span style="float: left;">إتمام الدفع</span>
            </div>
            <div style="padding: 10px; background: #f8f9fa; border-radius: 8px;">
                <strong>Esc</strong> <span style="float: left;">إغلاق النوافذ</span>
            </div>
        </div>
    </div>
</div>
