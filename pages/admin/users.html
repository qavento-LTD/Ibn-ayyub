<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المستخدمين - لوحة التحكم</title>
    <link rel="stylesheet" href="../../css/admin-theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Page Specific Overrides */
        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-main);
            padding: 12px 20px;
            border-radius: var(--radius-md);
            width: 100%;
            max-width: 400px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        .search-box i {
            color: var(--text-secondary);
            margin-left: 10px;
        }

        .search-box input {
            border: none;
            background: none;
            outline: none;
            width: 100%;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-main);
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <main class="main-content">
            <!-- Header Area -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <div>
                    <h1 style="font-size: 1.5rem; font-weight: 700; color: #111827; margin-bottom: 4px;">المستخدمين</h1>
                    <p style="color: #6b7280; font-size: 0.9rem;">إدارة حسابات العملاء والمسؤولين</p>
                </div>
            </div>

            <div class="card">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="بحث بالاسم أو البريد...">
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>الاسم</th>
                                <th>البريد الإلكتروني</th>
                                <th>رقم الهاتف</th>
                                <th>الدور</th>
                                <th>تاريخ الانضمام</th>
                                <th>إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- Users will be loaded here -->
                        </tbody>
                    </table>
                </div>

                <div id="loading" style="padding: 60px; text-align: center;">
                    <div class="spinner" style="border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
                    <p style="color: #6b7280;">جاري تحميل المستخدمين...</p>
                </div>

                <div id="noResults" style="display: none; text-align: center; padding: 40px; color: #6b7280;">
                    لا توجد نتائج مطابقة
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Role Modal -->
    <div id="editRoleModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">تعديل صلاحيات المستخدم</h3>
                <button class="close-modal" onclick="document.getElementById('editRoleModal').classList.remove('active')">&times;</button>
            </div>

            <p id="modalUserName" style="margin-bottom: 24px; color: var(--text-secondary);"></p>

            <div style="margin-bottom: 24px;">
                <label style="display: block; margin-bottom: 10px; font-weight: 600;">الدور الجديد:</label>
                <select id="roleSelect" class="form-select">
                    <option value="customer">عميل (Customer)</option>
                    <option value="admin">مسؤول (Admin)</option>
                </select>
            </div>

            <div style="display: flex; gap: 12px;">
                <button id="saveRole" class="btn btn-primary" style="flex: 1;">حفظ</button>
                <button id="cancelEdit" class="btn btn-secondary" style="flex: 1;">إلغاء</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initAdminLayout } from '../../js/admin/layout.js';
        initAdminLayout('users');
    </script>
    <script type="module" src="../../js/admin/users.js"></script>
</body>

</html>
