<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المستخدمين - لوحة التحكم</title>
    <!-- CSS is injected by layout.js, but we include it here for faster initial paint -->
    <link rel="stylesheet" href="../../css/admin-theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Page Specific Overrides */
        .users-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            padding: 24px;
            border: 1px solid var(--border-color);
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-main);
            padding: 12px 20px;
            border-radius: var(--radius-md);
            width: 100%;
            max-width: 400px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        .search-box i {
            color: var(--text-secondary);
            margin-left: 10px;
        }

        .search-box input {
            border: none;
            background: none;
            outline: none;
            width: 100%;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-main);
        }

        .role-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-block;
        }

        .role-admin {
            background: rgba(230, 57, 70, 0.1);
            color: var(--primary);
        }

        .role-customer {
            background: rgba(69, 123, 157, 0.1);
            color: var(--secondary);
        }

        .action-btn {
            padding: 6px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: white;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
        }

        .action-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <!-- Main Content -->
        <main class="main-content">
            <!-- Header is injected by layout.js -->

            <div class="users-card">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="بحث بالاسم أو البريد...">
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>الاسم</th>
                                <th>البريد الإلكتروني</th>
                                <th>رقم الهاتف</th>
                                <th>الدور</th>
                                <th>تاريخ الانضمام</th>
                                <th>إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- Users will be loaded here -->
                        </tbody>
                    </table>
                </div>

                <div id="loading" style="padding: 40px; text-align: center;">
                    <div class="spinner"
                        style="border: 4px solid rgba(0,0,0,0.1); border-left-color: var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto;">
                    </div>
                    <p style="margin-top: 10px; color: var(--text-secondary);">جاري تحميل المستخدمين...</p>
                    <style>
                        @keyframes spin {
                            0% {
                                transform: rotate(0deg);
                            }

                            100% {
                                transform: rotate(360deg);
                            }
                        }
                    </style>
                </div>

                <div id="noResults"
                    style="display: none; text-align: center; padding: 40px; color: var(--text-secondary);">
                    لا توجد نتائج مطابقة
                </div>
            </div>
        </main>
    </div>

    <!-- Edit Role Modal -->
    <div id="editRoleModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">تعديل صلاحيات المستخدم</h3>
                <button class="close-modal"
                    onclick="document.getElementById('editRoleModal').classList.remove('active')">&times;</button>
            </div>

            <p id="modalUserName" style="margin-bottom: 24px; color: var(--text-secondary);"></p>

            <div style="margin-bottom: 24px;">
                <label style="display: block; margin-bottom: 10px; font-weight: 600;">الدور الجديد:</label>
                <select id="roleSelect" class="form-select">
                    <option value="customer">عميل (Customer)</option>
                    <option value="admin">مسؤول (Admin)</option>
                </select>
            </div>

            <div style="display: flex; gap: 12px;">
                <button id="saveRole" class="btn btn-primary" style="flex: 1;">حفظ</button>
                <button id="cancelEdit" class="btn btn-secondary" style="flex: 1;">إلغاء</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initAdminLayout } from '../../js/admin/layout.js';
        initAdminLayout('users.html');
    </script>
    <script type="module" src="../../js/admin/users.js"></script>
</body>

</html>
