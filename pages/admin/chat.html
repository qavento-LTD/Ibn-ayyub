<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المحادثات - لوحة التحكم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../Front-End/Appearance/index.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            font-family: 'Cairo', sans-serif;
        }

        .admin-chat-container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .conversations-sidebar {
            width: 350px;
            background: white;
            border-left: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }

        .sidebar-header h2 {
            font-size: 1.3rem;
            margin-bottom: 5px;
        }

        .search-box {
            margin-top: 15px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 10px 40px 10px 15px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
        }

        .conversation-item {
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .conversation-item:hover {
            background: #f8f8f8;
        }

        .conversation-item.active {
            background: #e6f7ff;
            border-right: 3px solid var(--primary);
        }

        .conversation-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .conversation-info {
            flex: 1;
            min-width: 0;
        }

        .conversation-name {
            font-weight: 700;
            margin-bottom: 5px;
            font-size: 0.95rem;
        }

        .conversation-preview {
            font-size: 0.85rem;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-meta {
            text-align: left;
            font-size: 0.75rem;
            color: #999;
        }

        .unread-badge {
            background: var(--primary);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
            margin-top: 5px;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chat-header {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-header h3 {
            flex: 1;
            font-size: 1.2rem;
        }

        .chat-actions {
            display: flex;
            gap: 15px;
        }

        .action-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #666;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btn:hover {
            color: var(--primary);
        }

        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9f9f9;
        }

        .admin-message {
            display: flex;
            margin-bottom: 15px;
            gap: 10px;
        }

        .admin-message.sent {
            justify-content: flex-end;
        }

        .admin-message.received {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 60%;
            padding: 10px 15px;
            border-radius: 12px;
            position: relative;
        }

        .admin-message.sent .message-bubble {
            background: var(--primary);
            color: white;
            border-bottom-left-radius: 3px;
        }

        .admin-message.received .message-bubble {
            background: white;
            color: #333;
            border-bottom-right-radius: 3px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .message-text {
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .message-time {
            font-size: 0.7rem;
            margin-top: 5px;
            opacity: 0.7;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .send-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .conversations-sidebar {
                width: 100%;
                position: absolute;
                z-index: 100;
                display: none;
            }

            .conversations-sidebar.active {
                display: flex;
            }

            .chat-area.hidden {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="admin-chat-container">
        <!-- Conversations Sidebar -->
        <div class="conversations-sidebar" id="conversationsSidebar">
            <div class="sidebar-header">
                <h2>المحادثات</h2>
                <div class="search-box">
                    <input type="text" placeholder="بحث..." id="searchInput">
                    <i class="fas fa-search"></i>
                </div>
            </div>
            <div class="conversations-list" id="conversationsList">
                <div style="padding:40px; text-align:center; color:#999;">
                    <i class="fas fa-spinner fa-spin" style="font-size:2rem;"></i>
                    <p style="margin-top:15px;">جاري التحميل...</p>
                </div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area" id="chatArea">
            <div class="empty-state" id="emptyState">
                <i class="fas fa-comments"></i>
                <h3>اختر محادثة للبدء</h3>
                <p>حدد محادثة من القائمة للرد على العملاء</p>
            </div>

            <div id="activeChatContainer" style="display:none; flex-direction:column; height:100%;">
                <div class="chat-header">
                    <button class="action-btn" id="backBtn" style="display:none;">
                        <i class="fas fa-arrow-right"></i>
                    </button>
                    <h3 id="chatTitle">محادثة</h3>
                    <div class="chat-actions">
                        <button class="action-btn" title="تحديث">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                        <button class="action-btn" title="المزيد">
                            <i class="fas fa-ellipsis-v"></i>
                        </button>
                    </div>
                </div>

                <div class="messages-area" id="messagesArea">
                    <!-- Messages will be added here -->
                </div>

                <div class="input-area">
                    <input type="text" id="adminInput" placeholder="اكتب ردك هنا...">
                    <button class="send-btn" id="adminSendBtn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../../js/admin/chat-admin.js"></script>
</body>

</html>
