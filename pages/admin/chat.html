<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحادثات - لوحة التحكم</title>
    <!-- CSS is injected by layout.js, but we include it here for faster initial paint -->
    <link rel="stylesheet" href="../../css/admin-theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Page Specific Overrides */
        .chat-container {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            display: flex;
            height: calc(100vh - 140px);
            /* Adjusted for new header */
            min-height: 500px;
            border: 1px solid var(--border-color);
        }

        /* Conversations List */
        .conversations-sidebar {
            width: 320px;
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
        }

        .conversations-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
            color: var(--text-secondary);
            background: var(--bg-card);
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
        }

        .conversation-item {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
        }

        .conversation-item:hover {
            background: var(--bg-hover);
        }

        .conversation-item.active {
            background: var(--bg-card);
            border-right: 4px solid var(--primary);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .user-info {
            flex: 1;
            overflow: hidden;
        }

        .user-name {
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .last-message {
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            background: var(--primary);
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 10px;
            min-width: 20px;
            text-align: center;
        }

        /* Chat Area */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
        }

        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            color: var(--text-main);
        }

        .chat-user-name {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .messages-area {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: var(--bg-main);
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            position: relative;
            line-height: 1.5;
        }

        .message.received {
            align-self: flex-start;
            background: var(--bg-card);
            border-bottom-right-radius: 4px;
            box-shadow: var(--shadow-sm);
            color: var(--text-main);
        }

        .message.sent {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow-sm);
        }

        .message-time {
            font-size: 0.7rem;
            margin-top: 4px;
            opacity: 0.7;
            text-align: left;
        }

        .input-area {
            padding: 20px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
        }

        .message-input {
            flex: 1;
            padding: 12px 20px;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s;
            background: var(--bg-main);
            color: var(--text-main);
        }

        .message-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
            background: var(--primary-dark);
        }

        /* Empty State */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-align: center;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <!-- Main Content -->
        <main class="main-content">
            <!-- Header is injected by layout.js -->

            <div class="chat-container">
                <!-- Sidebar -->
                <div class="conversations-sidebar">
                    <div class="conversations-header">
                        المحادثات النشطة
                    </div>
                    <div id="conversations-wrapper" class="conversations-list">
                        <div style="padding: 20px; text-align: center; color: var(--gray-dark);">
                            <div class="spinner" style="margin: 0 auto 10px;"></div>
                            جاري التحميل...
                        </div>
                    </div>
                </div>

                <!-- Chat Area -->
                <div class="chat-main">
                    <div id="active-chat-header" class="chat-header" style="display: none;">
                        <div>
                            <div id="chat-user-name" class="chat-user-name">اسم العميل</div>
                            <!-- <div class="chat-status">متصل الآن</div> -->
                        </div>
                    </div>

                    <div id="admin-chat-messages" class="messages-area">
                        <div class="empty-state">
                            <i class="fas fa-comments"></i>
                            <h3>اختر محادثة للبدء</h3>
                            <p>يمكنك التواصل مع العملاء مباشرة من هنا</p>
                        </div>
                    </div>

                    <div id="chat-input-area" class="input-area" style="display: none;">
                        <input type="text" id="admin-message-input" class="message-input" placeholder="اكتب ردك هنا...">
                        <button id="admin-send-btn" class="send-btn">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initAdminLayout } from '../../js/admin/layout.js';
        initAdminLayout('chat.html');
    </script>
    <script type="module" src="../../js/admin/chat-admin.js"></script>
</body>

</html>
