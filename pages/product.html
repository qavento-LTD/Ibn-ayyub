<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>تفاصيل المنتج - هديتي</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link rel="stylesheet" href="../Front-End/Appearance/index.css">
	<style>
		/* Page specific overrides */
		header {
			position: sticky;
		}

		.product-detail-page {
			padding: 60px 20px;
			max-width: 1200px;
			margin: 0 auto;
		}

		.product-detail-container {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 50px;
			background: white;
			padding: 40px;
			border-radius: 24px;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
		}

		.product-image-container {
			width: 100%;
			height: 500px;
			border-radius: 16px;
			overflow: hidden;
			background: #f8f9fa;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.product-image-container img {
			width: 100%;
			height: 100%;
			object-fit: cover;
		}

		.product-image-container i {
			font-size: 5rem;
			color: #ddd;
		}

		.product-info-container {
			display: flex;
			flex-direction: column;
			justify-content: center;
		}

		.product-category {
			color: var(--primary);
			font-weight: 600;
			margin-bottom: 10px;
			font-size: 0.9rem;
			text-transform: uppercase;
			letter-spacing: 1px;
		}

		.product-title-large {
			font-size: 2.5rem;
			margin-bottom: 20px;
			color: var(--text-main);
			line-height: 1.2;
		}

		.product-price-large {
			font-size: 2rem;
			color: var(--primary);
			font-weight: 700;
			margin-bottom: 30px;
		}

		.product-description-large {
			color: var(--text-light);
			line-height: 1.8;
			font-size: 1.1rem;
			margin-bottom: 40px;
		}

		.actions {
			display: flex;
			gap: 20px;
			align-items: center;
		}

		.quantity-selector {
			display: flex;
			align-items: center;
			border: 2px solid #eee;
			border-radius: 50px;
			padding: 5px;
		}

		.qty-btn {
			width: 40px;
			height: 40px;
			border-radius: 50%;
			border: none;
			background: white;
			cursor: pointer;
			font-size: 1.2rem;
			color: var(--text-main);
			transition: 0.3s;
		}

		.qty-btn:hover {
			background: #f5f5f5;
		}

		.qty-input {
			width: 50px;
			text-align: center;
			border: none;
			font-size: 1.2rem;
			font-weight: 600;
			outline: none;
		}

		.add-to-cart-large {
			flex: 1;
			padding: 15px 30px;
			background: var(--primary);
			color: white;
			border: none;
			border-radius: 50px;
			font-size: 1.1rem;
			font-weight: 700;
			cursor: pointer;
			transition: 0.3s;
			box-shadow: 0 10px 20px rgba(183, 28, 28, 0.2);
		}

		.add-to-cart-large:hover {
			background: #7F0000;
			transform: translateY(-3px);
			box-shadow: 0 15px 30px rgba(183, 28, 28, 0.3);
		}

		@media (max-width: 768px) {
			.product-detail-container {
				grid-template-columns: 1fr;
				padding: 20px;
			}

			.product-image-container {
				height: 300px;
			}
		}
	</style>
</head>

<body>
	<!-- Header -->
	<header>
		<div class="logo">
			<a href="../index.html" style="text-decoration: none;">
				<h2 style="color: var(--primary); font-weight: 800; margin: 0;">هديتي</h2>
			</a>
		</div>
		<div class="icon-navs">
			<div style="position: relative;">
				<div id="cart" style="cursor: pointer; padding: 10px;">
					<i class="fas fa-shopping-cart fa-lg"></i>
				</div>
				<!-- Cart Dropdown -->
				<section class="cart-container">
					<!-- Header -->
					<header>
						<div class="logo">
							<h2>Ibn <span>Ayyub</span></h2>
						</div>

						<div class="icon-navs">
							<div class="cart-icon-wrapper" id="cart-btn">
								<i class="fa-solid fa-bag-shopping"></i>
								<span class="cart-count" id="cart-count">0</span>
							</div>
							<div class="login" id="auth-section">
								<!-- Dynamic Auth Content -->
							</div>
							<div class="menu" id="menu-btn">
								<span></span>
								<span></span>
								<span></span>
							</div>
						</div>
					</header>

					<!-- Navigation Sidebar -->
					<nav class="nav" id="nav-menu">
						<ul>
							<li><a href="../index.html">الرئيسية</a></li>
							<li><a href="products.html">المنتجات</a></li>
							<li><a href="cart.html">سلة الشراء</a></li>
							<li><a href="#contact">تواصل معنا</a></li>
						</ul>
					</nav>

					<!-- Product Details Section -->
					<section class="product-details-container"
						style="margin-top: 150px; padding: 0 40px; max-width: 1200px; margin-left: auto; margin-right: auto;">
						<div id="product-content"
							style="display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start;">
							<!-- Dynamic Content -->
							<div class="loading">جاري تحميل تفاصيل المنتج...</div>
						</div>
					</section>

					<!-- Cart Dropdown -->
					<div class="cart-container" id="cart-dropdown">
						<div class="cart-header"
							style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
							<h3>سلة الشراء</h3>
							<button id="close-cart" style="font-size: 1.2rem;"><i
									class="fa-solid fa-xmark"></i></button>
						</div>
						<div class="cart-items-wrapper" id="cart-items">
							<!-- Cart Items -->
						</div>
						<div class="cart-footer">
							<div
								style="display: flex; justify-content: space-between; font-weight: 700; font-size: 1.2rem; margin-bottom: 15px;">
								<span>المجموع:</span>
								<span id="cart-total">0 ج.م</span>
							</div>
							<button class="checkout-btn" onclick="window.location.href='cart.html'">إتمام
								الشراء</button>
						</div>
					</div>
					<p class="product-description-large" id="productDescription"></p>

					<div class="actions">
						<div class="quantity-selector">
							<button class="qty-btn" onclick="updateQty(-1)">-</button>
							<input type="text" value="1" class="qty-input" id="qtyInput" readonly>
							<button class="qty-btn" onclick="updateQty(1)">+</button>
						</div>
						<button class="add-to-cart-large" id="addToCartBtn">أضف إلى السلة</button>
					</div>
			</div>
		</div>
		</main>

		<!-- Footer -->
		<footer style="margin-top: auto;">
			<div class="footer-bottom">
				<p>&copy; 2025 <strong>هديتي</strong>. جميع الحقوق محفوظة.</p>
			</div>
		</footer>

		<script type="module" src="../Front-End/Interaction/product.js"></script>
		<script src="../Front-End/Interaction/main.js"></script>
		<script>
			function updateQty(change) {
				const input = document.getElementById('qtyInput');
				let val = parseInt(input.value);
				val = Math.max(1, val + change);
				input.value = val;
			}
		</script>
</body>

</html>
