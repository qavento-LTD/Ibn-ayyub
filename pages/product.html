<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>تفاصيل المنتج - هديتي</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link rel="stylesheet" href="../Front-End/Appearance/index.css">
	<style>
		:root {
			--primary-color: #b71c1c;
			--primary-hover: #a50000;
			--bg-color: #f8f9fa;
			--card-bg: #ffffff;
			--text-main: #2d3436;
			--text-light: #636e72;
			--border-color: #dfe6e9;
		}

		body {
			background-color: var(--bg-color);
			color: var(--text-main);
			font-family: 'Cairo', sans-serif;
		}

		.product-page {
			max-width: 1200px;
			margin: 40px auto;
			padding: 0 20px;
		}

		/* Product Container */
		.product-container {
			background: var(--card-bg);
			border-radius: 24px;
			padding: 40px;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 50px;
			margin-bottom: 60px;
		}

		@media (max-width: 992px) {
			.product-container {
				grid-template-columns: 1fr;
				padding: 30px;
				gap: 30px;
			}
		}

		/* Image Section */
		.product-image-wrapper {
			position: relative;
			border-radius: 20px;
			overflow: hidden;
			background: #f1f2f6;
			height: 500px;
			display: flex;
			align-items: center;
			justify-content: center;
			border: 1px solid var(--border-color);
		}

		.product-image-wrapper img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			transition: transform 0.5s ease;
		}

		.product-image-wrapper:hover img {
			transform: scale(1.05);
		}

		/* Info Section */
		.product-info {
			display: flex;
			flex-direction: column;
			justify-content: center;
		}

		.product-category {
			display: inline-block;
			background: rgba(183, 28, 28, 0.1);
			color: var(--primary-color);
			padding: 6px 15px;
			border-radius: 50px;
			font-size: 0.9rem;
			font-weight: 700;
			margin-bottom: 15px;
			width: fit-content;
		}

		.product-title {
			font-size: 2.5rem;
			font-weight: 800;
			margin-bottom: 20px;
			line-height: 1.3;
			color: var(--text-main);
		}

		.product-price {
			font-size: 2.2rem;
			font-weight: 800;
			color: var(--primary-color);
			margin-bottom: 30px;
			display: flex;
			align-items: center;
			gap: 15px;
		}

		.product-description {
			font-size: 1.1rem;
			line-height: 1.8;
			color: var(--text-light);
			margin-bottom: 40px;
			padding: 20px;
			background: #f8f9fa;
			border-radius: 12px;
			border-right: 4px solid var(--primary-color);
		}

		/* Actions */
		.actions-wrapper {
			display: flex;
			gap: 20px;
			align-items: center;
			flex-wrap: wrap;
		}

		.qty-selector {
			display: flex;
			align-items: center;
			background: #f1f2f6;
			border-radius: 50px;
			padding: 5px;
			border: 1px solid var(--border-color);
		}

		.qty-btn {
			width: 40px;
			height: 40px;
			border-radius: 50%;
			border: none;
			background: white;
			color: var(--text-main);
			font-size: 1.2rem;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all 0.2s;
			box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
		}

		.qty-btn:hover {
			background: var(--primary-color);
			color: white;
		}

		.qty-input {
			width: 50px;
			text-align: center;
			border: none;
			background: transparent;
			font-size: 1.2rem;
			font-weight: 700;
			color: var(--text-main);
		}

		.add-to-cart-btn {
			flex: 1;
			padding: 15px 40px;
			background: var(--primary-color);
			color: white;
			border: none;
			border-radius: 50px;
			font-size: 1.1rem;
			font-weight: 700;
			cursor: pointer;
			transition: all 0.3s;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
			box-shadow: 0 5px 20px rgba(183, 28, 28, 0.3);
			min-width: 200px;
		}

		.add-to-cart-btn:hover {
			background: var(--primary-hover);
			transform: translateY(-2px);
			box-shadow: 0 8px 25px rgba(183, 28, 28, 0.4);
		}

		.add-to-cart-btn:disabled {
			background: #ccc;
			cursor: not-allowed;
			transform: none;
			box-shadow: none;
		}

		/* Reviews Section */
		.reviews-section {
			max-width: 900px;
			margin: 0 auto;
		}

		.section-header {
			text-align: center;
			margin-bottom: 40px;
		}

		.section-header h2 {
			font-size: 2rem;
			font-weight: 800;
			margin-bottom: 10px;
		}

		.review-form-card {
			background: white;
			padding: 40px;
			border-radius: 20px;
			box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
			margin-bottom: 40px;
		}

		.form-group {
			margin-bottom: 20px;
		}

		.form-label {
			display: block;
			margin-bottom: 8px;
			font-weight: 700;
			color: var(--text-main);
		}

		.form-input,
		.form-textarea {
			width: 100%;
			padding: 12px 15px;
			border: 2px solid var(--border-color);
			border-radius: 12px;
			font-family: inherit;
			font-size: 1rem;
			transition: border-color 0.3s;
		}

		.form-input:focus,
		.form-textarea:focus {
			border-color: var(--primary-color);
			outline: none;
		}

		.star-rating {
			display: flex;
			gap: 10px;
			font-size: 1.5rem;
			color: #ddd;
			cursor: pointer;
			margin-bottom: 10px;
		}

		.star-rating i.active {
			color: #f1c40f;
		}

		.submit-review-btn {
			width: 100%;
			padding: 15px;
			background: var(--text-main);
			color: white;
			border: none;
			border-radius: 12px;
			font-weight: 700;
			cursor: pointer;
			transition: all 0.3s;
		}

		.submit-review-btn:hover {
			background: var(--primary-color);
		}

		/* Loading State */
		.loading-state {
			text-align: center;
			padding: 100px 20px;
		}

		.spinner {
			width: 50px;
			height: 50px;
			border: 5px solid #f3f3f3;
			border-top: 5px solid var(--primary-color);
			border-radius: 50%;
			animation: spin 1s linear infinite;
			margin: 0 auto 20px;
		}

		@keyframes spin {
			0% {
				transform: rotate(0deg);
			}

			100% {
				transform: rotate(360deg);
			}
		}
	</style>
</head>

<body>
	<!-- Header -->
	<header>
		<div class="logo">
			<a href="../index.html" style="text-decoration: none;">
				<img src="../assets/images/logo.png" alt="هديتي" style="height: 50px;">
			</a>
		</div>

		<!-- Main Navigation -->
		<nav class="nav">
			<a href="../index.html" class="nav-link">
				<i class="fas fa-home"></i>
				<span>الرئيسية</span>
			</a>
			<a href="products.html" class="nav-link active">
				<i class="fas fa-gifts"></i>
				<span>المنتجات</span>
			</a>
			<a href="videos.html" class="nav-link">
				<i class="fas fa-video"></i>
				<span>الفيديوهات</span>
			</a>
			<a href="track-order.html" class="nav-link">
				<i class="fas fa-search-location"></i>
				<span>تتبع طلبك</span>
			</a>
			<a href="contact.html" class="nav-link">
				<i class="fas fa-envelope"></i>
				<span>اتصل بنا</span>
			</a>
			<a href="support-chat.html" class="nav-link" style="color: var(--primary-color);">
				<i class="fas fa-headset"></i>
				<span>المساعد الذكي</span>
			</a>
		</nav>

		<div class="icon-navs">
			<div class="cart-icon-wrapper" id="cart-btn">
				<i class="fa-solid fa-bag-shopping"></i>
				<span class="cart-count" id="cart-count">0</span>
			</div>
			<div class="login" id="auth-section">
				<!-- Dynamic Auth Content -->
			</div>
			<div class="menu" id="menu-btn">
				<span></span>
				<span></span>
				<span></span>
			</div>
		</div>

		<!-- Cart Dropdown -->
		<section class="cart-container">
			<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
				<h2 class="section-title" style="margin: 0; font-size: 1.2rem;">سلة الشراء</h2>
				<button id="closeCart" style="background:none; border:none; cursor:pointer;">
					<i class="fas fa-times"></i>
				</button>
			</div>

			<div class="cart-items-wrapper" style="max-height: 300px; overflow-y: auto;">
				<!-- Cart items will be added here dynamically -->
				<div class="empty-cart-msg" style="text-align: center; padding: 20px; color: var(--text-light);">
					سلة التسوق فارغة
				</div>
			</div>
		</section>
	</header>

	<main class="product-page">
		<!-- Product Details -->
		<div id="product-content">
			<div class="loading-state">
				<div class="spinner"></div>
				<p>جاري تحميل تفاصيل المنتج...</p>
			</div>
		</div>

		<!-- Reviews Section -->
		<section class="reviews-section">
			<div class="section-header">
				<h2><i class="fas fa-star" style="color: #f1c40f;"></i> آراء العملاء</h2>
				<p style="color: var(--text-light);">شاركنا تجربتك مع هذا المنتج</p>
			</div>

			<!-- Add Review Form -->
			<div class="review-form-card">
				<h3 style="margin-bottom: 25px; font-weight: 700;">أضف تقييمك</h3>
				<form id="review-form">
					<div class="form-group" style="text-align: center;">
						<label class="form-label">التقييم</label>
						<div class="star-rating" id="starRating">
							<i class="far fa-star" data-value="1"></i>
							<i class="far fa-star" data-value="2"></i>
							<i class="far fa-star" data-value="3"></i>
							<i class="far fa-star" data-value="4"></i>
							<i class="far fa-star" data-value="5"></i>
						</div>
						<input type="hidden" id="ratingValue" required>
					</div>

					<div class="form-group">
						<label class="form-label">الاسم</label>
						<input type="text" id="review-name" class="form-input" required placeholder="اسمك الكريم">
					</div>

					<div class="form-group">
						<label class="form-label">التعليق</label>
						<textarea id="review-comment" class="form-textarea" rows="4" required
							placeholder="اكتب رأيك هنا..."></textarea>
					</div>

					<button type="submit" class="submit-review-btn">
						<i class="fas fa-paper-plane"></i> إرسال التقييم
					</button>
				</form>
			</div>

			<!-- Reviews List -->
			<div id="reviews-list">
				<!-- Reviews will be loaded here -->
			</div>
		</section>
	</main>

	<!-- Footer -->
	<footer style="background: white; padding: 40px 0; margin-top: 60px; border-top: 1px solid #eee;">
		<div style="max-width: 1200px; margin: 0 auto; padding: 0 20px; text-align: center;">
			<p>&copy; 2024 هديتي. جميع الحقوق محفوظة.</p>
		</div>
	</footer>

	<script type="module" src="../Front-End/Interaction/product.js"></script>
	<script type="module" src="../Front-End/Interaction/main.js"></script>
	<script type="module" src="../js/reviews.js"></script>
</body>

</html>
